<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>白水鉴心</title>
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#FFFFFF">
<link id="dynamic-manifest" rel="manifest" href="./manifest.json">
<link id="apple-touch-icon" rel="apple-touch-icon" href="./icon-192.png">
<script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js"></script>
<style>
/* =========== 全局基础样式 =========== */
:root{--bg:#FFFFFF;--text:#111111;--sub:#888888;--card:#F7F7F7;--border:#EAEAEA;--accent:#111111;--onAccent:#FFFFFF;--fs:15px;--font:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%;overflow:hidden}
body{font-family:var(--font);font-size:14px;background:var(--bg);color:var(--text);transition:background .3s,color .3s;-webkit-font-smoothing:antialiased}
button{font-family:inherit;cursor:pointer;outline:none;border:none;background:none}
input,textarea,select{font-family:inherit;color:inherit;outline:none}
.hide-text{-webkit-text-security:disc} /* 隐藏文字的魔法 */
.docx-file-input{display:none}
svg{display:block}

/* =========== App 框架 =========== */
.app{position:fixed;inset:0;display:flex;flex-direction:column;background-color:var(--bg);background-image:var(--wallpaper,none);background-size:cover;background-position:center;z-index:1}
.app-header{flex:0 0 auto;height:56px;display:flex;align-items:center;justify-content:space-between;padding:0 16px;background:transparent;z-index:20}
.header-title{font-size:16px;font-weight:600;letter-spacing:.5px}
.icon-btn{color:var(--text);width:40px;height:40px;display:flex;align-items:center;justify-content:center;border-radius:50%;transition:background .2s}
.icon-btn:active{background:var(--card)}

.page-container{flex:1;overflow-y:auto;padding:12px 20px 40px;scroll-behavior:smooth}
.page{display:none;animation:fadeIn .3s ease}.page.active{display:block}
@keyframes fadeIn{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}

/* =========== 搜索页 =========== */
.search-bar{display:flex;align-items:center;gap:10px;background:var(--card);border-radius:12px;padding:12px 16px;margin-bottom:24px}
.search-bar input{flex:1;border:none;background:none;font-size:14px}
.tag-group{margin-bottom:20px}
.tag-group-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.tag-group-title{font-size:13px;font-weight:600;letter-spacing:.5px}
.add-tag-btn{color:var(--sub);font-size:12px}
.tag-list{display:flex;flex-wrap:wrap;gap:10px}
.tag{padding:8px 16px;border-radius:8px;background:var(--card);color:var(--text);font-size:13px;transition:all .2s}
.tag.active{background:var(--accent);color:var(--onAccent)}

.btn{border-radius:10px;padding:12px 20px;font-size:14px;font-weight:500;transition:all .2s;display:inline-flex;align-items:center;justify-content:center}
.btn-primary{background:var(--accent);color:var(--onAccent)}
.btn-primary:active{opacity:.8}.btn-primary:disabled{opacity:.5}
.btn-outline{background:transparent;border:1px solid var(--border);color:var(--text)}
.btn-outline:active{background:var(--card)}
.btn-danger-outline{background:transparent;border:1px solid #D93025;color:#D93025}
.btn-block{width:100%;padding:14px;font-size:15px;margin-top:10px}

/* =========== 书架页 =========== */
.shelf-header{display:flex;justify-content:space-between;font-size:12px;color:var(--sub);margin-bottom:16px}
.shelf-item{display:flex;align-items:center;gap:16px;background:var(--card);border-radius:16px;padding:16px;margin-bottom:12px;cursor:pointer}
.shelf-item:active{transform:scale(.98)}
.shelf-cover{flex:0 0 auto;width:44px;height:58px;border-radius:6px;background:var(--border);display:flex;align-items:center;justify-content:center;overflow:hidden}
.shelf-cover img{width:100%;height:100%;object-fit:cover}
.shelf-info{flex:1;min-width:0}
.shelf-title{font-size:15px;font-weight:600;margin-bottom:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.shelf-meta{font-size:12px;color:var(--sub)}
.shelf-actions{display:flex;flex-direction:column;gap:8px}
.mini-btn{font-size:12px;color:var(--sub);padding:4px}
.mini-btn.danger{color:#D93025}
.empty-state{display:none;flex-direction:column;align-items:center;padding:80px 0;color:var(--sub)}

/* =========== 设置页 =========== */
.settings-section{background:var(--card);border-radius:16px;margin-bottom:16px;overflow:hidden}
.section-header{display:flex;justify-content:space-between;align-items:center;padding:18px 20px;cursor:pointer}
.section-title{font-size:15px;font-weight:600}.section-desc{font-size:12px;color:var(--sub);margin-top:4px}
.section-body{padding:0 20px 20px;display:none}
.settings-section.expanded .section-body{display:block}
.chevron{transition:transform .3s;color:var(--sub);transform:rotate(-90deg)}
.settings-section.expanded .chevron{transform:rotate(0deg)}

.field{margin-bottom:16px}.field-label{display:block;font-size:12px;color:var(--sub);margin-bottom:8px}
.text-input,.text-area,.select{width:100%;background:var(--bg);border:none;border-radius:10px;padding:12px 14px;font-size:14px;transition:box-shadow .2s}
.text-area{resize:vertical;min-height:80px;line-height:1.6}
.select{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--sub) 50%),linear-gradient(135deg,var(--sub) 50%,transparent 50%);background-position:calc(100% - 16px) 50%,calc(100% - 11px) 50%;background-size:4px 4px;background-repeat:no-repeat;padding-right:36px}
.btn-row{display:flex;flex-wrap:wrap;gap:10px;margin-top:12px}

/* 密码框与眼睛图标 */
.pwd-wrap{position:relative}
.pwd-wrap .text-input{padding-right:44px}
.eye-btn{position:absolute;right:12px;top:50%;transform:translateY(-50%);color:var(--sub);cursor:pointer;padding:4px}
.eye-btn svg{width:18px;height:18px}

/* 条目列表 */
.item-list{display:flex;flex-direction:column;gap:8px;margin-bottom:12px;max-height:200px;overflow-y:auto;}
.item-card{background:var(--bg);padding:12px;border-radius:10px;display:flex;justify-content:space-between;align-items:center;}
.item-info{flex:1;min-width:0;margin-right:10px;cursor:pointer;}
.item-title{font-size:13.5px;font-weight:500;margin-bottom:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.item-desc{font-size:11.5px;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.item-del{color:#D93025;font-size:12px;padding:4px 8px;}

/* =========== 全屏阅读器 =========== */
.reader-overlay{position:fixed;inset:0;z-index:1000;display:flex;flex-direction:column;transition:background .3s,color .3s;transform:translateY(100%);pointer-events:none}
.reader-overlay.show{transform:translateY(0);pointer-events:auto}
.reader-header{height:56px;display:flex;align-items:center;justify-content:space-between;padding:0 16px;flex:0 0 auto}
.reader-title{font-size:15px;font-weight:600;flex:1;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.reader-content-wrap{flex:1;overflow:hidden;position:relative}
.reader-content{width:100%;height:100%;padding:0 20px;overflow-y:auto;line-height:1.8;font-size:var(--r-fs,16px)}
.reader-content.mode-page{column-width:100vw;column-gap:20px;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;padding:0 20px;word-break:break-word}
.reader-content.mode-page p{scroll-snap-align:start;margin-top:0}
.reader-append{padding:20px 0 60px 0;}
.reader-append h4{font-size:14px;color:var(--sub);margin-bottom:10px;border-top:1px dashed var(--sub);padding-top:20px;}
.reader-history{font-size:13px;color:var(--sub);margin-bottom:16px;background:rgba(128,128,128,0.1);padding:12px;border-radius:8px;}
.reader-history .dir{font-weight:600;margin-bottom:4px;color:inherit}
.reader-input{width:100%;padding:12px;border-radius:8px;border:1px solid var(--sub);background:transparent;color:inherit;font-size:14px;margin-bottom:10px}
.reader-footer{height:60px;flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;padding:0 20px;border-top:1px solid rgba(128,128,128,0.2)}

/* 阅读器设置面板 */
.reader-settings-panel{position:absolute;bottom:0;left:0;right:0;background:var(--bg);border-radius:20px 20px 0 0;padding:20px;z-index:1001;transform:translateY(100%);transition:transform .3s;box-shadow:0 -4px 20px rgba(0,0,0,0.1)}
.reader-settings-panel.show{transform:translateY(0)}
.r-setting-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.r-setting-label{font-size:14px;font-weight:500}
.r-color-group{display:flex;gap:10px}
.r-color-btn{width:28px;height:28px;border-radius:50%;border:2px solid transparent}
.r-color-btn.active{border-color:var(--text)}
.segmented{display:flex;background:var(--card);border-radius:10px;padding:4px}
.segmented button{flex:1;padding:6px 12px;font-size:13px;border-radius:8px;color:var(--sub)}
.segmented button.active{background:var(--bg);color:var(--text);font-weight:500;box-shadow:0 1px 3px rgba(0,0,0,.05)}

/* =========== 抽屉 =========== */
.drawer-overlay{position:fixed;inset:0;background:rgba(0,0,0,.3);opacity:0;pointer-events:none;transition:.3s;z-index:100;backdrop-filter:blur(2px)}
.drawer-overlay.show{opacity:1;pointer-events:auto}
.drawer{position:absolute;top:0;left:0;bottom:0;width:280px;background:var(--bg);transform:translateX(-100%);transition:.3s cubic-bezier(.4,0,.2,1);display:flex;flex-direction:column;box-shadow:4px 0 24px rgba(0,0,0,.05)}
.drawer-overlay.show .drawer{transform:translateX(0)}
.drawer-head{padding:30px 24px 20px}
.drawer-head h3{margin:0 0 6px;font-size:18px;font-weight:600}
.drawer-head p{margin:0;font-size:12px;color:var(--sub)}
.drawer-list{padding:10px 12px}
.drawer-item{display:flex;align-items:center;gap:14px;width:100%;padding:14px 16px;border-radius:12px;font-size:15px;text-align:left;color:var(--text);transition:background .2s}
.drawer-item:active{background:var(--card)}
.drawer-item svg{color:var(--sub)}

/* =========== 弹窗与 Toast =========== */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.4);display:flex;align-items:flex-end;opacity:0;pointer-events:none;transition:.3s;z-index:2000}
.modal-overlay.show{opacity:1;pointer-events:auto}
.modal{width:100%;max-width:600px;max-height:90vh;background:var(--bg);border-radius:24px 24px 0 0;display:flex;flex-direction:column;transform:translateY(100%);transition:.3s}
.modal-overlay.show .modal{transform:translateY(0)}
.modal-header{display:flex;justify-content:space-between;align-items:center;padding:20px 24px;border-bottom:1px solid var(--border)}
.modal-header h2{margin:0;font-size:16px;font-weight:600}
.modal-body{flex:1;overflow-y:auto;padding:20px 24px}
.modal-footer{display:flex;gap:12px;padding:16px 24px calc(20px + env(safe-area-inset-bottom));border-top:1px solid var(--border)}
.modal-footer .btn{flex:1;padding:14px}

#toast{position:fixed;left:50%;bottom:100px;transform:translateX(-50%) translateY(10px);background:rgba(0,0,0,.85);color:#fff;padding:12px 20px;border-radius:10px;font-size:13px;opacity:0;pointer-events:none;transition:.3s;z-index:9999;max-width:80vw;text-align:center}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* 底栏 */
.bottom-bar{flex:0 0 auto;display:flex;height:64px;background:var(--bg);border-top:1px solid var(--border);z-index:30}
.nav-item{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:var(--sub);font-size:10px}
.nav-item.active{color:var(--text)}
.nav-item svg{width:22px;height:22px}

/* 阅读器字体选择 */
.r-font-select{min-width:140px;width:auto;padding:8px 32px 8px 12px;font-size:13px;background:var(--card);border-radius:8px;border:none;color:var(--text);appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--sub) 50%),linear-gradient(135deg,var(--sub) 50%,transparent 50%);background-position:calc(100% - 12px) 50%,calc(100% - 8px) 50%;background-size:4px 4px;background-repeat:no-repeat}
.r-font-upload-name{font-size:12px;color:var(--sub);max-width:120px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* =========== 白水鉴心·雪落枯树开屏 =========== */
#inkIntro{
  position:fixed;inset:0;z-index:10000;overflow:hidden;
  background:
    radial-gradient(ellipse at 50% 53%,rgba(120,120,120,.09),transparent 48%),
    linear-gradient(180deg,#f8f8f7 0%,#f1f1ef 62%,#e9e9e7 100%);
  color:#292929;opacity:1;visibility:visible;
  transition:opacity 1.2s ease,visibility 1.2s ease;isolation:isolate;
}
#inkIntro.is-leaving{opacity:0;visibility:hidden;pointer-events:none}
#inkIntro .far-mist{
  position:absolute;inset:0;pointer-events:none;
  background:
    radial-gradient(ellipse at 18% 62%,rgba(255,255,255,.9),transparent 28%),
    radial-gradient(ellipse at 82% 54%,rgba(255,255,255,.8),transparent 30%),
    radial-gradient(ellipse at 50% 83%,rgba(255,255,255,.75),transparent 34%);
  filter:blur(24px);animation:mistDrift 9s ease-in-out infinite alternate;
}
#inkIntro .tear{
  position:absolute;z-index:5;left:50%;top:13%;
  width:15px;height:22px;opacity:0;transform:translateX(-50%);
  filter:drop-shadow(0 5px 8px rgba(30,30,30,.15));
  animation:tearFall 1.8s cubic-bezier(.45,.02,.55,.98) .25s forwards;
}
#inkIntro .tear svg{width:100%;height:100%;display:block}
#inkIntro .tear-ripple{
  position:absolute;left:50%;top:66%;width:8px;height:8px;border:1px solid rgba(65,65,65,.35);
  border-radius:50%;transform:translate(-50%,-50%) scale(.2);opacity:0;
  animation:ripple 1.1s ease-out 1.75s forwards;
}
#inkIntro .landscape{
  position:absolute;left:50%;bottom:10%;width:min(100vw,1100px);height:min(69vh,690px);
  transform:translateX(-50%);opacity:0;overflow:visible;
  animation:landscapeAppear 3.8s ease-out 2.05s forwards;
}
#inkIntro .landscape path,#inkIntro .landscape ellipse{
  vector-effect:non-scaling-stroke;
}
#inkIntro .tree-line{
  fill:none;stroke:#303030;stroke-linecap:round;stroke-linejoin:round;
  stroke-dasharray:var(--len,1200);stroke-dashoffset:var(--len,1200);
  animation:treeInk var(--dur,3.2s) cubic-bezier(.2,.65,.25,1) 2.15s forwards;
}
#inkIntro .trunk{stroke-width:8;opacity:.72;filter:url(#farBleed)}
#inkIntro .branch{stroke-width:4.5;opacity:.62;filter:url(#farBleed)}
#inkIntro .twig{stroke-width:2;opacity:.48;filter:url(#farBleed)}
#inkIntro .snow{
  position:absolute;inset:-8% 0 0;z-index:4;pointer-events:none;overflow:hidden;
  opacity:0;animation:snowWake 1s ease 2.15s forwards;
}
#inkIntro .flake{
  position:absolute;top:-8%;left:var(--x);width:var(--s);height:var(--s);
  border-radius:50%;background:rgba(255,255,255,var(--a,.9));
  box-shadow:0 0 5px rgba(80,80,80,.12);
  animation:snowFall var(--t) linear var(--d) infinite;
}
#inkIntro .poem{
  position:absolute;z-index:6;left:50%;bottom:7%;
  width:90%;transform:translateX(-50%);
  display:flex;flex-direction:column;align-items:center;gap:clamp(10px,2.1vh,20px);
  color:rgba(35,35,35,.82);font-family:"STSong","Songti SC","Noto Serif CJK SC",serif;
  font-weight:400;letter-spacing:.28em;text-align:center;
  text-shadow:0 1px 12px rgba(255,255,255,.95);
}
#inkIntro .poem-line{
  font-size:clamp(17px,3.7vw,26px);white-space:nowrap;
  opacity:0;filter:blur(8px);
}
#inkIntro .poem-line:first-child{
  transform:translateX(-1.8em);animation:poemHorizontal 1.7s ease 5.55s forwards;
}
#inkIntro .poem-line:last-child{
  transform:translateX(1.8em);animation:poemHorizontal 1.7s ease 6.2s forwards;
}
#inkIntro .seal{
  position:absolute;right:6%;bottom:4%;font:10px/1.5 serif;letter-spacing:.22em;
  color:rgba(45,45,45,.38);writing-mode:vertical-rl;opacity:0;
  animation:poemHorizontal 1.3s ease 7s forwards
}
#inkIntro .intro-skip{
  position:absolute;z-index:8;right:22px;bottom:calc(18px + env(safe-area-inset-bottom));
  padding:9px 13px;border:1px solid rgba(40,40,40,.2);border-radius:30px;
  color:rgba(30,30,30,.55);font-size:11px;letter-spacing:.12em;
  background:rgba(255,255,255,.35);backdrop-filter:blur(8px)
}
@keyframes tearFall{
  0%{opacity:0;transform:translate(-50%,-12px) scale(.75)}
  12%{opacity:.82}
  72%{opacity:.9;transform:translate(-50%,39vh) scale(1)}
  84%{opacity:.3;transform:translate(-50%,43vh) scale(.7,.9)}
  100%{opacity:0;transform:translate(-50%,43vh) scale(.2)}
}
@keyframes ripple{0%{opacity:0;transform:translate(-50%,-50%) scale(.2)}25%{opacity:.65}100%{opacity:0;transform:translate(-50%,-50%) scale(13,4)}}
@keyframes landscapeAppear{0%{opacity:0;filter:blur(16px)}35%{opacity:.35}100%{opacity:.94;filter:blur(0)}}
@keyframes treeInk{to{stroke-dashoffset:0}}
@keyframes snowWake{to{opacity:1}}
@keyframes snowFall{0%{transform:translate3d(0,-8vh,0);opacity:0}10%{opacity:.9}90%{opacity:.75}100%{transform:translate3d(var(--drift),115vh,0);opacity:0}}
@keyframes poemHorizontal{0%{opacity:0;filter:blur(8px)}100%{opacity:1;filter:blur(0);transform:translateX(0)}}
@keyframes mistDrift{from{transform:translate3d(-1%,0,0) scale(.98)}to{transform:translate3d(1%, -1%,0) scale(1.04)}}
@media(max-width:600px){
  #inkIntro .landscape{width:112vw;height:61vh;bottom:17%}
  #inkIntro .poem{bottom:9%;gap:12px;width:94%}
  #inkIntro .poem-line{font-size:clamp(16px,4.2vw,21px);letter-spacing:.16em}
  #inkIntro .seal{right:4%;bottom:5%}
}
@media(prefers-reduced-motion:reduce){
  #inkIntro *,#inkIntro::before,#inkIntro::after{animation-duration:.01ms!important;animation-delay:0ms!important}
}
</style>
</head>
<body>

<!-- 白水鉴心·水墨开屏动画 -->
<div id="inkIntro" aria-label="白水鉴心水墨开屏" role="presentation">
  <div class="far-mist"></div>
  <div class="tear" aria-hidden="true">
    <svg viewBox="0 0 24 32"><path d="M12 1 C9 7 3 14 3 20a9 9 0 0 0 18 0C21 14 15 7 12 1Z" fill="#555" opacity=".72"/><path d="M8 19c0-3 2-6 3-8" fill="none" stroke="#fff" stroke-width="1.5" stroke-linecap="round" opacity=".75"/></svg>
  </div>
  <div class="tear-ripple" aria-hidden="true"></div>

  <svg class="landscape" viewBox="0 0 1000 700" preserveAspectRatio="xMidYMid meet" aria-hidden="true">
    <defs>
      <filter id="farBleed" x="-25%" y="-25%" width="150%" height="150%">
        <feTurbulence type="fractalNoise" baseFrequency=".014 .024" numOctaves="2" seed="17" result="noise"/>
        <feDisplacementMap in="SourceGraphic" in2="noise" scale="8"/>
        <feGaussianBlur stdDeviation="1.1"/>
      </filter>
      <filter id="landMist"><feGaussianBlur stdDeviation="15"/></filter>
    </defs>
    <!-- 远处山雾与雪地，留出大片空白 -->
    <g fill="#777" opacity=".09" filter="url(#landMist)">
      <path d="M0 545 Q150 485 300 530T610 515T1000 520V700H0Z"/>
      <ellipse cx="505" cy="610" rx="460" ry="42"/>
    </g>
    <!-- 远景树影 -->
    <g fill="none" stroke="#555" stroke-linecap="round" opacity=".13" filter="url(#landMist)">
      <path d="M505 620 C500 500 508 370 500 230 C496 165 480 110 458 65" stroke-width="22"/>
      <path d="M500 300 C420 245 360 180 325 105 M505 360 C590 300 655 225 700 140" stroke-width="13"/>
    </g>
    <!-- 主树：树干基本挺立，枝冠横向舒展，完整呈现远景 -->
    <g>
      <path class="tree-line trunk" style="--len:1050;--dur:3.2s" d="M500 625 C492 545 506 475 500 395 C496 320 508 250 500 180 C495 120 481 80 455 42"/>
      <path class="tree-line branch" style="--len:700;--dur:2.9s" d="M500 405 C430 365 365 320 310 260 C270 215 238 168 220 118"/>
      <path class="tree-line branch" style="--len:720;--dur:2.9s" d="M501 360 C570 325 630 275 690 215 C735 168 770 120 790 72"/>
      <path class="tree-line branch" style="--len:560;--dur:2.7s" d="M500 275 C435 230 390 180 365 125 C350 91 345 62 348 32"/>
      <path class="tree-line branch" style="--len:570;--dur:2.7s" d="M501 230 C560 190 610 145 640 95 C656 68 665 43 664 18"/>
      <path class="tree-line branch" style="--len:420;--dur:2.5s" d="M500 520 C430 490 370 450 325 400 C292 364 268 330 252 292"/>
      <path class="tree-line branch" style="--len:440;--dur:2.5s" d="M501 475 C565 445 625 405 675 355 C710 320 738 280 755 240"/>

<script>
/* ================= 基础工具 ================= */
const $ = s => document.querySelector(s);
const esc = s => String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
let toastT;
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('show'),3500);} // 稍微延长一点显示时间

const THEMES = {
  day:{bg:'#FFFFFF',text:'#111111',sub:'#888888',card:'#F7F7F7',border:'#EAEAEA',accent:'#111111',onAccent:'#FFFFFF'},
  night:{bg:'#000000',text:'#EEEEEE',sub:'#666666',card:'#141414',border:'#222222',accent:'#FFFFFF',onAccent:'#000000'},
  korean:{bg:'#F4F4F4',text:'#222222',sub:'#999999',card:'#FFFFFF',border:'#EBEBEB',accent:'#333333',onAccent:'#FFFFFF'}
};
const TAGS = [
  {id:'world',title:'世界观',tags:['ABO','哨兵向导','星际','末日','修仙','西幻','现代都市','古代架空','娱乐圈','兽人']},
  {id:'rel',title:'关系设定',tags:['年上','年下','青梅竹马','破镜重圆','先婚后爱','追妻火葬场','强强','双强']},
  {id:'genre',title:'题材类型',tags:['娱乐圈','校园','职场','电竞','体育竞技','悬疑推理','无限流','系统']},
  {id:'gender',title:'性别组合',tags:['BG','BL','GL','GB','无CP','百合','耽美','言情']},
  {id:'style',title:'热门风格',tags:['甜宠','虐恋','沙雕','正剧','轻松','暗黑','治愈','致郁']}
];

/* ================= 状态管理 ================= */
const state = {
  theme:'day', selectedTags:{}, customTags:{}, shelf:[], 
  apiUrl:'', apiKey:'', apiModel:'gpt-3.5-turbo',
  apiPresets: [],
  characters: [], masks: [], worldviews: [], worldbooks: [],
  styles: [{id:'s1', title:'晋江文学', content:''}, {id:'s2', title:'起点文学', content:''}, {id:'s3', title:'番茄文学', content:''}, {id:'s4', title:'LOFTER文学', content:''}],
  appIcon: '', // 存储自定义图标 base64
  customFont: null // 存储用户上传的自定义字体
};

// API 密钥仅保存在当前浏览器标签页的 sessionStorage，不写入长期配置 jj_v3。
// 注意：sessionStorage 不是加密保险箱；同源脚本仍可能读取它，请勿在不可信设备上保存密钥。
const SECRET_STORAGE_KEY = 'jj_v3_session_secrets';
function readSessionSecrets(){
  try { return JSON.parse(sessionStorage.getItem(SECRET_STORAGE_KEY) || '{}') || {}; }
  catch(e) { return {}; }
}
function saveSecrets(){
  try {
    const presetKeys = {};
    (state.apiPresets || []).forEach((p, i) => { if (p && p.key) presetKeys[i] = p.key; });
    sessionStorage.setItem(SECRET_STORAGE_KEY, JSON.stringify({ apiKey: state.apiKey || '', presetKeys }));
  } catch(e) { console.warn('当前会话密钥保存失败', e); }
}
function save(){
  try {
    const persisted = { ...state, apiKey: '' };
    persisted.apiPresets = (state.apiPresets || []).map(p => ({ ...p, key: '' }));
    localStorage.setItem('jj_v3', JSON.stringify(persisted));
    saveSecrets();
  } catch(e) { console.warn('存储空间已满', e); toast('存储空间已满，请注意清理'); }
}
function load(){
  try{
    const d=JSON.parse(localStorage.getItem('jj_v3'));
    if(d) Object.assign(state, d);
    ['characters','masks','worldviews','worldbooks','apiPresets','styles'].forEach(k => {
      if(!Array.isArray(state[k])) state[k] = [];
    });
    if(!state.styles.length) state.styles = [{id:'s1', title:'晋江文学', content:''}, {id:'s2', title:'起点文学', content:''}];

    const secrets = readSessionSecrets();
    // 兼容旧版本：把旧配置中的明文密钥迁移到当前会话，然后从长期配置中清除。
    if (!secrets.apiKey && state.apiKey) secrets.apiKey = state.apiKey;
    state.apiKey = secrets.apiKey || '';
    (state.apiPresets || []).forEach((p, i) => {
      if (secrets.presetKeys && secrets.presetKeys[i]) p.key = secrets.presetKeys[i];
      else p.key = p.key || '';
    });
    save();
  }catch(e){ console.warn('读取配置失败', e); }
}

function updateManifestAndIcon() {

    return;
  }
  $('#appIconPreview').innerHTML = `<img src="${state.appIcon}" style="width:100%;height:100%;object-fit:cover;">`;

    start_url: "./",
    display: "standalone",
    background_color: "#ffffff",
    theme_color: "#ffffff",

      { src: state.appIcon, sizes: "192x192", type: "image/png" },
      { src: state.appIcon, sizes: "512x512", type: "image/png" }
    ]
  };
  
  // 转换为 Blob URL
  const stringManifest = JSON.stringify(manifest);
  const blob = new Blob([stringManifest], {type: 'application/json'});
  const manifestURL = URL.createObjectURL(blob);
  
  // 替换 link 标签
  $('#dynamic-manifest').setAttribute('href', manifestURL);
  $('#apple-touch-icon').setAttribute('href', state.appIcon);

$('#appIconInput').onchange = function(e) {
  const file = e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = function(ev) {
    const img = new Image();
    img.onload = function() {
      const canvas = document.createElement('canvas');
      const ctx = canvas.getContext('2d');
      // 压缩为 192x192 的正方形
      canvas.width = 192; canvas.height = 192;
      // 居中裁剪
      const size = Math.min(img.width, img.height);
      const x = (img.width - size) / 2;
      const y = (img.height - size) / 2;
      ctx.drawImage(img, x, y, size, size, 0, 0, 192, 192);
      
      const base64 = canvas.toDataURL('image/png');
      state.appIcon = base64;
      save();
      updateManifestAndIcon();
      toast('图标已更新！请删除桌面旧图标后重新添加');
    };
    img.src = ev.target.result;
  };
  reader.readAsDataURL(file);
  $('#appIconInput').value = '';
};

// 导入文件逻辑
let currentImportKey = null;
window.triggerImport = function(key) {
  currentImportKey = key;
  $('#fileInput').value = '';
  $('#fileInput').click();
}

$('#fileInput').onchange = function(e) {
  const file = e.target.files[0];
  if(!file) return;
  
  const ext = file.name.split('.').pop().toLowerCase();
  const reader = new FileReader();
  
  reader.onload = async function(ev) {
    let text = '';
    if(ext === 'docx') {
      try {
        const res = await mammoth.extractRawText({arrayBuffer: ev.target.result});
        text = res.value;
      } catch(err) { return toast('docx 解析失败'); }
    } else if(ext === 'json') {
      try {
        text = ev.target.result;
        const parsed = JSON.parse(text);
        if(Array.isArray(parsed)) {
          parsed.forEach(item => {
            if(item.title) state[currentImportKey].push({id:Date.now().toString()+Math.random(), title:item.title, content:item.content||''});
          });
          save(); renderLibs(); toast('批量导入成功'); return;
        } else if (typeof parsed === 'object') {
           text = parsed.content || JSON.stringify(parsed);
        }
      } catch(err) { return toast('JSON 格式错误'); }
    } else {
      text = ev.target.result;
    }
    
    if($('#libContent')) {
      $('#libContent').value = text;
      toast('导入成功，请点击保存');
    } else {
      const title = file.name.replace(/\.[^/.]+$/, "");
      state[currentImportKey].push({id:Date.now().toString(), title, content:text});
      save(); renderLibs(); toast('导入成功，已新建条目');
    }
  };
  
  if(ext === 'docx') reader.readAsArrayBuffer(file);
  else reader.readAsText(file);
};

window.importToTextarea = function() {
  const input = document.createElement('input');
  input.type = 'file'; input.accept = '.txt,.json,.docx';
  input.onchange = e => {
    const file = e.target.files[0]; if(!file) return;
    const ext = file.name.split('.').pop().toLowerCase();
    const reader = new FileReader();
    reader.onload = async ev => {
      let text = '';
      if(ext==='docx') {
        const res = await mammoth.extractRawText({arrayBuffer: ev.target.result});
        text = res.value;
      } else text = ev.target.result;
      $('#libContent').value = text;
      toast('已导入到文本框');
    };
    if(ext==='docx') reader.readAsArrayBuffer(file);
    else reader.readAsText(file);
  };
  input.click();
}

function getSysPrompt(selectedIds) {
  let s = '你是一位资深同人小说作者，擅长创作高质量中文小说。\n';
  s += '【绝对遵守规则】\n';

  s += '2. 严格遵循设定的字数要求。如果故事未完结，你必须继续生成直到情节完整，绝对不允许中途截断！\n\n';

// 🚀 精确捕获报错信息的 API 调用
async function callAI(msgs){
  const url=(state.apiUrl||'').trim(); if(!url)throw new Error('请先在设置中填写API URL');
  let ep=url.replace(/\/+$/,''); if(!/\/chat\/completions$/.test(ep))ep+='/chat/completions';
  
  const res = await fetch(ep, {
    method:'POST',
    headers:{'Content-Type':'application/json', ...(state.apiKey?{'Authorization':'Bearer '+state.apiKey}:{})},
    body:JSON.stringify({model:state.apiModel||'gpt-3.5-turbo', messages:msgs, temperature:0.85, max_tokens:4096})
  });

  if(!res.ok) {
    let errMsg = `API请求失败 (状态码 ${res.status})`;
    try {
      const errData = await res.json();
      if(errData && errData.error && errData.error.message) {
        errMsg = errData.error.message;
      } else if (errData && errData.message) {
        errMsg = errData.message;
      }
    } catch(e) {
      // 忽略 JSON 解析错误
    }
    
    // 根据状态码追加详细解释
    if (res.status === 401) errMsg = '【API密钥无效】' + errMsg;
    else if (res.status === 403) errMsg = '【拒绝访问/余额不足】' + errMsg;
    else if (res.status === 429) errMsg = '【请求太频繁/额度超限】' + errMsg;
    else if (res.status >= 500) errMsg = '【API服务器内部错误】' + errMsg;
    
    throw new Error(errMsg);
  }
  
  const d = await res.json(); 
  const txt = d?.choices?.[0]?.message?.content || d?.choices?.[0]?.text;
  if(!txt)throw new Error('API返回内容为空，可能是被安全策略拦截'); 
  return txt.trim();
}

async function handleGenerate(tags) {
  const f = $('#mForbidden').value.trim();
  if (!f) return toast('请填写严禁生成的内容');
  const wc = $('#mWordCount').value, ex = $('#mExpand').value.trim(), st = $('#mStyle').value;
  
  const selectedIds = [];
  document.querySelectorAll('input[type="checkbox"]:checked').forEach(cb => selectedIds.push(cb.value));

  const btn = document.querySelector('#modalFooter .btn-primary');
  btn.disabled = true; btn.textContent = '生成中...';
  
  try {
    const p = `请以【${st}】文风创作约${wc}字同人小说。\n标签：${tags.join('、')}\n${ex ? '具体指令：' + ex + '\n' : ''}严禁内容：${f}\n要求：直接输出正文，不加标题解释。`;
    const txt = await callAI([{role: 'system', content: getSysPrompt(selectedIds)}, {role: 'user', content: p}]);
    
    const newArticle = { 
      id: 'a_' + Date.now(), 
      title: tags.slice(0,3).join('·') + '小说', 
      date: new Date().toLocaleDateString(), 
      content: txt, 
      history: [],
      cover: '' 
    };
    state.shelf.unshift(newArticle); 
    save(); renderShelf();
    closeModal(); 
    toast('生成成功');
    openReader(newArticle.id);
  } catch (e) {
    // 这里由于 callAI 的强化，会显示非常详细的原因
    alert('❌ 生成失败：\n' + e.message); 
    btn.disabled = false; btn.textContent = '开始生成';
  }
}

// 封面图片上传逻辑（带压缩）
$('#coverInput').onchange = function(e) {
  const file = e.target.files[0];
  if(!file || !editingBookId) return;
  const reader = new FileReader();
  reader.onload = function(ev) {
    const img = new Image();
    img.onload = function() {
      const canvas = document.createElement('canvas');
      const ctx = canvas.getContext('2d');
      const maxSize = 200;
      let w = img.width, h = img.height;
      if (w > h) { if (w > maxSize) { h = Math.round(h * maxSize / w); w = maxSize; } }
      else { if (h > maxSize) { w = Math.round(w * maxSize / h); h = maxSize; } }
      canvas.width = w; canvas.height = h;
      ctx.drawImage(img, 0, 0, w, h);
      
      const base64 = canvas.toDataURL('image/jpeg', 0.8);
      const a = state.shelf.find(x=>x.id===editingBookId);
      if(a) {
        a.cover = base64;
        $('#coverPreview').innerHTML = `<img src="${base64}" style="width:100%;height:100%;object-fit:cover;">`;
      }
    };
    img.src = ev.target.result;
  };
  reader.readAsDataURL(file);
  $('#coverInput').value = '';
};

let currentArticleId = null;

function openReader(id) {
  const a = state.shelf.find(x=>x.id===id); if(!a) return;
  currentArticleId = id;
  $('#readerTitle').textContent = a.title;
  
  let html = `<div class="reader-text">${esc(a.content).replace(/\n/g, '<br>')}</div>`;
  html += `<div class="reader-append">`;
  html += `<h4>续写记录</h4>`;
  if(!a.history || !a.history.length) {
    html += `<div class="reader-history">暂无续写记录</div>`;
  } else {
    a.history.forEach(h => {
      html += `<div class="reader-history"><div class="dir">指令：${esc(h.dir)}</div>${esc(h.text).replace(/\n/g, '<br>')}</div>`;
    });
  }
  html += `<div class="field">
    <textarea id="readerContInput" class="reader-input" rows="3" placeholder="输入续写方向（留空则AI自由发挥）..."></textarea>
    <button class="btn btn-primary btn-block" onclick="handleContinue()">立即续写</button>
  </div></div>`;
  
  $('#readerContent').innerHTML = html;
  $('#readerContent').className = 'reader-content mode-' + readerSettings.mode;
  applyReaderTheme();
  
  $('#readerOverlay').classList.add('show');
  $('#readerContent').scrollTop = 0;
  $('#readerSettingsPanel').classList.remove('show');
}

window.closeReader = () => {
  $('#readerOverlay').classList.remove('show');
  currentArticleId = null;
}

async function handleContinue() {
  const dir = $('#readerContInput').value.trim();
  const a = state.shelf.find(x=>x.id===currentArticleId);
  if(!a) return;
  
  const btn = document.querySelector('#readerContent .btn-primary');
  btn.disabled = true; btn.textContent = '续写中...';
  
  try {
    let p = `以下是前文：\n${a.content}\n\n`;
    if (dir) {
      p += `续写方向：${dir}\n`;
    } else {
      p += `续写要求：请顺着前文的情节自然续写，保持原有文风，推动剧情发展。\n`;
    }
    p += `要求：直接输出正文，不要截断，不要解释。`;
    
    const txt = await callAI([{role:'system', content: getSysPrompt([])}, {role:'user', content: p}]);
    
    a.history = a.history || [];
    a.history.push({dir: dir || '（自然续写）', text: txt});
    a.content += '\n\n' + txt;
    save(); renderShelf(); openReader(a.id);
    toast('续写成功');
  } catch(e) {
    // 这里直接弹窗显示极其详细的错误
    alert('❌ 续写失败：\n' + e.message);
    btn.disabled = false; btn.textContent = '立即续写';
  }
}

/* ================= 阅读器设置 ================= */
const readerSettings = { bg:'#FFFFFF', text:'#111111', fs:16, mode:'scroll', font:'kaiti' };

function openReaderSettings() { $('#readerSettingsPanel').classList.add('show'); }
function closeReaderSettings() { $('#readerSettingsPanel').classList.remove('show'); }

function applyReaderTheme() {
  const rc = $('#readerContent');
  $('#readerOverlay').style.background = readerSettings.bg;
  $('#readerOverlay').style.color = readerSettings.text;
  rc.style.fontSize = readerSettings.fs + 'px';

  const fontMap = {
    'system': '-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif',
    'kaiti': '"KaiTi","STKaiti","SimKai","楷体","BiauKai",serif',
    'songti': '"SimSun","Songti SC","宋体",serif',
    'heiti': '"SimHei","Heiti SC","黑体","Microsoft YaHei","PingFang SC",sans-serif'
  };

  if (readerSettings.font === 'custom' && state.customFont && state.customFont.data) {
    rc.style.fontFamily = '"CustomFont",sans-serif';
  } else {
    rc.style.fontFamily = fontMap[readerSettings.font] || fontMap['kaiti'];
  }

  document.querySelectorAll('#readerBgGroup .r-color-btn').forEach(b => {
    b.classList.toggle('active', b.dataset.bg === readerSettings.bg);
  });

  const fontSel = $('#readerFontSelect');
  if (fontSel) fontSel.value = readerSettings.font;

  const customRow = $('#customFontRow');
  if (customRow) customRow.style.display = readerSettings.font === 'custom' ? 'flex' : 'none';
}
function changeReaderFontSize(step) {
  readerSettings.fs = Math.min(26, Math.max(12, readerSettings.fs + step));
  applyReaderTheme();
}

/* ================= 字体管理 ================= */
function loadCustomFont(fontData) {
  const oldStyle = document.getElementById('custom-font-face');
  if (oldStyle) oldStyle.remove();
  const style = document.createElement('style');
  style.id = 'custom-font-face';
  style.textContent = `@font-face { font-family: 'CustomFont'; src: url('${fontData}'); font-display: swap; }`;
  document.head.appendChild(style);
}

/* ================= API 预设管理 ================= */
function renderPresetSelector(selectedName) {
  const sel = $('#presetSelector');
  sel.innerHTML = `<option value="">-- 选择预设 --</option>` + (state.apiPresets || []).map(p => `<option value="${esc(p.name)}">${esc(p.name)}</option>`).join('');
  if (selectedName) sel.value = selectedName;
}

window.newPreset = () => {
  const name = prompt('请输入预设名称');
  if (!name || !name.trim()) return;
  state.apiPresets = state.apiPresets || [];
  if (state.apiPresets.some(p => p.name === name.trim())) return toast('预设名称已存在');
  state.apiPresets.push({ name: name.trim(), url: state.apiUrl, key: state.apiKey, model: state.apiModel });
  save(); renderPresetSelector(name.trim()); toast('预设已创建');
};

window.saveCurrentPreset = () => {
  const name = $('#presetSelector').value;
  if (!name) return toast('请先选择一个预设');
  const p = state.apiPresets.find(x => x.name === name);
  if (p) {
    p.url = state.apiUrl; p.key = state.apiKey; p.model = state.apiModel;
    save(); toast('已保存到预设：' + name);
  }
};

window.deletePreset = () => {
  const name = $('#presetSelector').value;
  if (!name) return toast('请先选择一个预设');
  if (!confirm(`确定删除预设「${name}」吗？`)) return;
  state.apiPresets = state.apiPresets.filter(x => x.name !== name);
  save(); renderPresetSelector(); toast('已删除');
};

/* ================= 系统弹窗与初始化 ================= */
function openModal(title,body,actions){
  $('#modalTitle').textContent=title;
  const b=$('#modalBody'); b.innerHTML=typeof body==='string'?body:'';
  const f=$('#modalFooter'); f.innerHTML='';
  (actions||[]).forEach(a=>{
    const btn=document.createElement('button');btn.className='btn '+(a.type==='primary'?'btn-primary':'btn-outline');btn.textContent=a.label;
    btn.onclick=a.onclick; f.appendChild(btn);
  });
  $('#modalOverlay').classList.add('show');
}
function closeModal(){$('#modalOverlay').classList.remove('show')}

function init(){
  load();
  applyTheme(state.theme);
  renderTags(); renderLibs(); renderShelf();
  renderPresetSelector();
  updateManifestAndIcon();
  
  // 导航栏与抽屉
  document.querySelectorAll('.nav-item').forEach(b=>b.onclick=()=>switchPage(b.dataset.page));
  document.querySelectorAll('.section-header').forEach(h=>h.onclick=()=>h.parentElement.classList.toggle('expanded'));
  
  $('#drawerBtn').onclick=()=>$('#drawerOverlay').classList.add('show');
  $('#drawerOverlay').onclick=e=>{if(e.target.id==='drawerOverlay')$('#drawerOverlay').classList.remove('show')};
  
  document.querySelectorAll('.drawer-item').forEach(b=>b.onclick=()=>{
    $('#drawerOverlay').classList.remove('show');
    const type=b.dataset.drawer;
    if(type==='close')return;
    if(type==='phone'){
      // 捡手机
      const charOpts = state.characters.map(c=>`<option value="${esc(c.content)}">${esc(c.title)}</option>`).join('');
      const maskOpts = state.masks.map(m=>`<option value="${esc(m.content)}">${esc(m.title)}</option>`).join('');
      openModal('捡手机',`
        <p style="font-size:12px;color:var(--sub);margin:0 0 16px">选择设定，生成聊天记录。</p>
        <div class="field"><label class="field-label">角色1</label><select id="pC1" class="select"><option value="">-- 选择角色库 --</option>${charOpts}</select></div>
        <div class="field"><label class="field-label">角色2</label><select id="pC2" class="select"><option value="">-- 选择角色库 --</option>${charOpts}</select></div>
        <div class="field"><label class="field-label">User面具 (选填)</label><select id="pM" class="select"><option value="">-- 选择面具 --</option>${maskOpts}</select></div>
        <div class="field" style="margin-bottom:0"><label class="field-label">聊天指令</label><textarea id="pIns" class="text-area" rows="3" placeholder="例如：两人因为一瓶水吵架..."></textarea></div>
      `,[
        {label:'生成',type:'primary',onclick:async()=>{
          const c1=$('#pC1').value.trim(),c2=$('#pC2').value.trim(),m=$('#pM').value.trim(),ins=$('#pIns').value.trim();
          if(!c1||!c2||!ins)return toast('请选择角色并填写指令');
          const btn=document.querySelector('#modalFooter .btn-primary');btn.disabled=true;btn.textContent='生成中...';
          try{
            let sys = getSysPrompt([]);
            sys += `\n【角色1设定】\n${c1}\n【角色2设定】\n${c2}`;
            if(m) sys += `\n【User面具】\n${m}`;
            sys += '\n请创作聊天记录格式，例如【角色】：内容';
            const txt=await callAI([{role:'system',content:sys},{role:'user',content:`指令：${ins}`}]);
            const a = { id:'a_'+Date.now(), title:'捡手机·聊天记录', date:new Date().toLocaleDateString(), content:txt, history:[], cover:'' };
            state.shelf.unshift(a); save(); renderShelf(); closeModal(); toast('生成成功'); openReader(a.id);
          }catch(e){alert('❌ 生成失败：\n' + e.message);btn.disabled=false;btn.textContent='生成'}
        }},{label:'取消',type:'outline',onclick:closeModal}
      ]);
    }else if(type==='drama'){
      // 小剧场
      const styleOpts = state.styles.map(s=>`<option value="${esc(s.title)}">${esc(s.title)}</option>`).join('');
      openModal('小剧场', `
        <p style="font-size:12px;color:var(--sub);margin:0 0 16px">输入剧情指令，生成短篇。</p>
        <div class="field"><label class="field-label">剧情提示词</label><textarea id="dIns" class="text-area" rows="3" placeholder="例如：末日废土下的重逢..."></textarea></div>
        <div class="field"><label class="field-label">字数</label><input type="number" id="dWc" class="text-input" value="1000"></div>
        <div class="field" style="margin-bottom:0"><label class="field-label">文风</label><select id="dSt" class="select">${styleOpts}</select></div>
      `, [
        {label: '生成', type: 'primary', onclick: async () => {
          const ins = $('#dIns').value.trim(), wc = $('#dWc').value.trim(), st = $('#dSt').value.trim();
          if (!ins || !wc || !st) return toast('请填写完整');
          const btn = document.querySelector('#modalFooter .btn-primary'); btn.disabled = true; btn.textContent = '生成中...';
          try {
            const txt = await callAI([{role: 'system', content: getSysPrompt([]) + `\n请以【${st}】文风创作。`}, {role: 'user', content: `指令:${ins}\n字数:约${wc}字`}]);
            const a = { id: 'a_' + Date.now(), title: '小剧场·' + ins.slice(0, 8), date: new Date().toLocaleDateString(), content: txt, history: [], cover:''};
            state.shelf.unshift(a); save(); renderShelf(); closeModal(); toast('生成成功'); openReader(a.id);
          } catch (e) {
            alert('❌ 生成失败：\n' + e.message); btn.disabled = false; btn.textContent = '生成';
          }
        }},
        {label: '取消', type: 'outline', onclick: closeModal}
      ]);
    }
  });

  // 阅读器设置事件
  $('#readerBackBtn').onclick = closeReader;
  $('#readerSettingBtn').onclick = openReaderSettings;
  document.querySelectorAll('#readerBgGroup .r-color-btn').forEach(b => {
    b.onclick = () => { readerSettings.bg = b.dataset.bg; readerSettings.text = b.dataset.txt; applyReaderTheme(); };
  });

  // 字体选择
  $('#readerFontSelect').onchange = (e) => {
    readerSettings.font = e.target.value;
    applyReaderTheme();
  };

  // 自定义字体上传
  $('#fontUploadInput').onchange = function(e) {
    const file = e.target.files[0];
    if (!file) return;
    const ext = file.name.split('.').pop().toLowerCase();
    if (!['ttf','otf','woff','woff2'].includes(ext)) {
      return toast('请上传 .ttf / .otf / .woff / .woff2 格式的字体文件');
    }
    const reader = new FileReader();
    reader.onload = function(ev) {
      state.customFont = { name: file.name, data: ev.target.result };
      loadCustomFont(ev.target.result);
      $('#customFontName').textContent = file.name;
      save();
      applyReaderTheme();
      toast('自定义字体已加载');
    };
    reader.readAsDataURL(file);
    $('#fontUploadInput').value = '';
  };

  // 恢复自定义字体
  if (state.customFont && state.customFont.data) {
    loadCustomFont(state.customFont.data);
    const nameEl = $('#customFontName');
    if (nameEl) nameEl.textContent = state.customFont.name;
  }

  document.querySelectorAll('#readerModeGroup button').forEach(b => {
    b.onclick = () => {
      document.querySelectorAll('#readerModeGroup button').forEach(x=>x.classList.remove('active'));
      b.classList.add('active');
      readerSettings.mode = b.dataset.mode;
      $('#readerContent').className = 'reader-content mode-' + readerSettings.mode;
    };
  });

  // API 事件
  $('#presetSelector').onchange = (e) => {
    const p = state.apiPresets.find(x => x.name === e.target.value);
    if (!p) return;
    state.apiUrl = p.url || ''; state.apiKey = p.key || ''; state.apiModel = p.model || 'gpt-3.5-turbo';
    $('#apiUrl').value = state.apiUrl; $('#apiKey').value = state.apiKey; $('#apiModel').value = state.apiModel;
    save(); toast('已切换预设');
  };
  $('#apiUrl').value=state.apiUrl; $('#apiKey').value=state.apiKey; $('#apiModel').value=state.apiModel;
  $('#apiUrl').oninput=e=>{state.apiUrl=e.target.value;save()};
  $('#apiKey').oninput=e=>{state.apiKey=e.target.value;save()};
  $('#apiModel').oninput=e=>{state.apiModel=e.target.value;save()};
  
  // 眼睛图标密码显示/隐藏
  let isKeyVisible = false;
  $('#toggleKeyBtn').onclick = () => {
    isKeyVisible = !isKeyVisible;
    const keyInput = $('#apiKey');
    if (isKeyVisible) {
      keyInput.classList.remove('hide-text');
      $('#eyeOpen').innerHTML = '<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line>';
    } else {
      keyInput.classList.add('hide-text');
      $('#eyeOpen').innerHTML = '<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle>';
    }
  };
  
  $('#themeQuickBtn').onclick=()=>applyTheme(state.theme==='day'?'night':state.theme==='night'?'korean':'day');
  document.querySelectorAll('#themeSegmented button').forEach(b=>b.onclick=()=>applyTheme(b.dataset.theme));
  
  $('#clearAllDataBtn').onclick = () => {
    if (confirm('⚠️ 警告！\n\n将清空所有文章、设定和配置，且无法恢复。确定吗？')) {
      localStorage.removeItem('jj_v3'); sessionStorage.removeItem(SECRET_STORAGE_KEY); location.reload();
    }
  };
  
  $('#openGenerateBtn').onclick = openGenerateModal;
  
  // 拉取模型逻辑
  $('#fetchModelsBtn').onclick = async () => {
    const url = (state.apiUrl || '').trim();
    if (!url) return toast('请先填写 API URL');
    const btn = $('#fetchModelsBtn'); const oldText = btn.textContent;
    btn.disabled = true; btn.textContent = '请求中...';
    try {
      let ep = url.replace(/\/+$/, '') + '/models';
      const res = await fetch(ep, { headers: { 'Authorization': 'Bearer ' + state.apiKey } });
      if(!res.ok) {
         if(res.status===401) throw new Error('密钥无效(401)');
         if(res.status===403) throw new Error('拒绝访问/余额不足(403)');
         throw new Error('请求失败('+res.status+')');
      }
      const data = await res.json();
      if(data && Array.isArray(data.data)) {
        const models = data.data.map(m => m && typeof m.id === 'string' ? m.id : '').filter(Boolean).sort();
        openModal('选择模型', '', [{label:'取消', type:'outline', onclick:closeModal}]);
        const list = document.createElement('div');
        list.style.cssText = 'display:flex;flex-direction:column;gap:8px;max-height:60vh;overflow-y:auto;';
        models.forEach(modelId => {
          const option = document.createElement('button');
          option.type = 'button';
          option.className = 'btn btn-outline';
          option.style.cssText = 'justify-content:flex-start;padding:12px;font-size:14px;word-break:break-all;';
          option.textContent = modelId;
          option.addEventListener('click', () => {
            state.apiModel = modelId;
            $('#apiModel').value = modelId;
            save(); closeModal(); toast('已选择模型');
          });
          list.appendChild(option);
        });
        if (!models.length) {
          const empty = document.createElement('p');
          empty.textContent = '接口没有返回可用模型';
          list.appendChild(empty);
        }
        $('#modalBody').appendChild(list);
      } else {
        throw new Error('返回格式不支持');
      }
    } catch(e) {
      alert('❌ 拉取失败：\n' + e.message);
    } finally {
      btn.disabled = false; btn.textContent = oldText;
    }
  };
  
  $('#testApiBtn').onclick = async () => {
    const b=$('#testApiBtn');b.textContent='测试中...';b.disabled=true;
    try{ await callAI([{role:'user',content:'回复正常'}]); toast('连接成功'); }
    catch(e){ alert('❌ 连接测试失败：\n' + e.message); }
    b.textContent='测试连接';b.disabled=false;
  };

  $('#modalClose').onclick=closeModal;
}

document.addEventListener('DOMContentLoaded', init);
</script>
<script>
if ('serviceWorker' in navigator) { navigator.serviceWorker.register('./sw.js').catch(console.error); }
</script>

<script>
/* 开屏动画：约 7 秒后淡出；点击可立即跳过 */
(function(){
  function dismissInkIntro(){
    const intro = document.getElementById('inkIntro');
    if(!intro || intro.classList.contains('is-leaving')) return;
    intro.classList.add('is-leaving');
    window.setTimeout(function(){ intro.remove(); }, 1250);
  }
  document.addEventListener('DOMContentLoaded', function(){
    const intro = document.getElementById('inkIntro');
    if(!intro) return;
    const skip = document.getElementById('inkIntroSkip');
    if(skip) skip.addEventListener('click', dismissInkIntro);
    intro.addEventListener('click', function(e){
      if(e.target === intro) dismissInkIntro();
    });
    window.setTimeout(dismissInkIntro, 9200);
  }, {once:true});
})();
</script>
