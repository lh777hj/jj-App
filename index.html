<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>同人文生成器</title>
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#FFFFFF">
<link rel="manifest" href="./manifest.json">
<script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js"></script>
<style>
/* =========== 全局基础样式 =========== */
:root{--bg:#FFFFFF;--text:#111111;--sub:#888888;--card:#F7F7F7;--border:#EAEAEA;--accent:#111111;--onAccent:#FFFFFF;--fs:15px;--font:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%;overflow:hidden}
body{font-family:var(--font);font-size:14px;background:var(--bg);color:var(--text);transition:background .3s,color .3s;-webkit-font-smoothing:antialiased}
button{font-family:inherit;cursor:pointer;outline:none;border:none;background:none}
input,textarea,select{font-family:inherit;color:inherit;outline:none}
.docx-file-input{display:none}
svg{display:block}

/* =========== App 框架 =========== */
.app{position:fixed;inset:0;display:flex;flex-direction:column;background-color:var(--bg);background-image:var(--wallpaper,none);background-size:cover;background-position:center;z-index:1}
.app-header{flex:0 0 auto;height:56px;display:flex;align-items:center;justify-content:space-between;padding:0 16px;background:transparent;z-index:20}
.header-title{font-size:16px;font-weight:600;letter-spacing:.5px}
.icon-btn{color:var(--text);width:40px;height:40px;display:flex;align-items:center;justify-content:center;border-radius:50%;transition:background .2s}
.icon-btn:active{background:var(--card)}

.page-container{flex:1;overflow-y:auto;padding:12px 20px 40px;scroll-behavior:smooth}
.page{display:none;animation:fadeIn .3s ease}.page.active{display:block}
@keyframes fadeIn{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}

/* =========== 搜索页 =========== */
.search-bar{display:flex;align-items:center;gap:10px;background:var(--card);border-radius:12px;padding:12px 16px;margin-bottom:24px}
.search-bar input{flex:1;border:none;background:none;font-size:14px}
.tag-group{margin-bottom:20px}
.tag-group-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.tag-group-title{font-size:13px;font-weight:600;letter-spacing:.5px}
.add-tag-btn{color:var(--sub);font-size:12px}
.tag-list{display:flex;flex-wrap:wrap;gap:10px}
.tag{padding:8px 16px;border-radius:8px;background:var(--card);color:var(--text);font-size:13px;transition:all .2s}
.tag.active{background:var(--accent);color:var(--onAccent)}

.btn{border-radius:10px;padding:12px 20px;font-size:14px;font-weight:500;transition:all .2s;display:inline-flex;align-items:center;justify-content:center}
.btn-primary{background:var(--accent);color:var(--onAccent)}
.btn-primary:active{opacity:.8}.btn-primary:disabled{opacity:.5}
.btn-outline{background:transparent;border:1px solid var(--border);color:var(--text)}
.btn-outline:active{background:var(--card)}
.btn-danger-outline{background:transparent;border:1px solid #D93025;color:#D93025}
.btn-block{width:100%;padding:14px;font-size:15px;margin-top:10px}

/* =========== 书架页 =========== */
.shelf-header{display:flex;justify-content:space-between;font-size:12px;color:var(--sub);margin-bottom:16px}
.shelf-item{display:flex;align-items:center;gap:16px;background:var(--card);border-radius:16px;padding:16px;margin-bottom:12px;cursor:pointer}
.shelf-item:active{transform:scale(.98)}
.shelf-cover{flex:0 0 auto;width:44px;height:58px;border-radius:6px;background:var(--border);display:flex;align-items:center;justify-content:center}
.shelf-info{flex:1;min-width:0}
.shelf-title{font-size:15px;font-weight:600;margin-bottom:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.shelf-meta{font-size:12px;color:var(--sub)}
.shelf-actions{display:flex;flex-direction:column;gap:8px}
.mini-btn{font-size:12px;color:var(--sub);padding:4px}
.mini-btn.danger{color:#D93025}
.empty-state{display:none;flex-direction:column;align-items:center;padding:80px 0;color:var(--sub)}

/* =========== 设置页 =========== */
.settings-section{background:var(--card);border-radius:16px;margin-bottom:16px;overflow:hidden}
.section-header{display:flex;justify-content:space-between;align-items:center;padding:18px 20px;cursor:pointer}
.section-title{font-size:15px;font-weight:600}.section-desc{font-size:12px;color:var(--sub);margin-top:4px}
.section-body{padding:0 20px 20px;display:none}
.settings-section.expanded .section-body{display:block}
.chevron{transition:transform .3s;color:var(--sub)}
.settings-section.expanded .chevron{transform:rotate(-90deg)}

.field{margin-bottom:16px}.field-label{display:block;font-size:12px;color:var(--sub);margin-bottom:8px}
.text-input,.text-area,.select{width:100%;background:var(--bg);border:none;border-radius:10px;padding:12px 14px;font-size:14px;transition:box-shadow .2s}
.text-area{resize:vertical;min-height:80px;line-height:1.6}
.select{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--sub) 50%),linear-gradient(135deg,var(--sub) 50%,transparent 50%);background-position:calc(100% - 16px) 50%,calc(100% - 11px) 50%;background-size:4px 4px;background-repeat:no-repeat;padding-right:36px}
.btn-row{display:flex;flex-wrap:wrap;gap:10px;margin-top:12px}

/* 条目列表 */
.item-list{display:flex;flex-direction:column;gap:8px;margin-bottom:12px;max-height:200px;overflow-y:auto;}
.item-card{background:var(--bg);padding:12px;border-radius:10px;display:flex;justify-content:space-between;align-items:center;}
.item-info{flex:1;min-width:0;margin-right:10px;}
.item-title{font-size:13.5px;font-weight:500;margin-bottom:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.item-desc{font-size:11.5px;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.item-del{color:#D93025;font-size:12px;padding:4px 8px;}

/* =========== 全屏阅读器 =========== */
.reader-overlay{position:fixed;inset:0;z-index:1000;display:flex;flex-direction:column;transition:background .3s,color .3s;transform:translateY(100%);pointer-events:none}
.reader-overlay.show{transform:translateY(0);pointer-events:auto}
.reader-header{height:56px;display:flex;align-items:center;justify-content:space-between;padding:0 16px;flex:0 0 auto}
.reader-title{font-size:15px;font-weight:600;flex:1;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.reader-content-wrap{flex:1;overflow:hidden;position:relative}
.reader-content{width:100%;height:100%;padding:0 20px;overflow-y:auto;line-height:1.8;font-size:var(--r-fs,16px)}
/* 左右翻页模式 */
.reader-content.mode-page{column-width:100vw;column-gap:20px;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;padding:0 20px;word-break:break-word}
.reader-content.mode-page p{scroll-snap-align:start;margin-top:0}
/* 续写区域 */
.reader-append{padding:20px 0 60px 0;}
.reader-append h4{font-size:14px;color:var(--sub);margin-bottom:10px;border-top:1px dashed var(--sub);padding-top:20px;}
.reader-history{font-size:13px;color:var(--sub);margin-bottom:16px;background:rgba(128,128,128,0.1);padding:12px;border-radius:8px;}
.reader-history .dir{font-weight:600;margin-bottom:4px;color:inherit}
.reader-input{width:100%;padding:12px;border-radius:8px;border:1px solid var(--sub);background:transparent;color:inherit;font-size:14px;margin-bottom:10px}
.reader-footer{height:60px;flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;padding:0 20px;border-top:1px solid rgba(128,128,128,0.2)}

/* 阅读器设置面板 */
.reader-settings-panel{position:absolute;bottom:0;left:0;right:0;background:var(--bg);border-radius:20px 20px 0 0;padding:20px;z-index:1001;transform:translateY(100%);transition:transform .3s;box-shadow:0 -4px 20px rgba(0,0,0,0.1)}
.reader-settings-panel.show{transform:translateY(0)}
.r-setting-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.r-setting-label{font-size:14px;font-weight:500}
.r-color-group{display:flex;gap:10px}
.r-color-btn{width:28px;height:28px;border-radius:50%;border:2px solid transparent}
.r-color-btn.active{border-color:var(--text)}
.segmented{display:flex;background:var(--card);border-radius:10px;padding:4px}
.segmented button{flex:1;padding:6px 12px;font-size:13px;border-radius:8px;color:var(--sub)}
.segmented button.active{background:var(--bg);color:var(--text);font-weight:500;box-shadow:0 1px 3px rgba(0,0,0,.05)}

/* =========== 弹窗与 Toast =========== */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.4);display:flex;align-items:flex-end;opacity:0;pointer-events:none;transition:.3s;z-index:2000}
.modal-overlay.show{opacity:1;pointer-events:auto}
.modal{width:100%;max-width:600px;max-height:90vh;background:var(--bg);border-radius:24px 24px 0 0;display:flex;flex-direction:column;transform:translateY(100%);transition:.3s}
.modal-overlay.show .modal{transform:translateY(0)}
.modal-header{display:flex;justify-content:space-between;align-items:center;padding:20px 24px;border-bottom:1px solid var(--border)}
.modal-header h2{margin:0;font-size:16px;font-weight:600}
.modal-body{flex:1;overflow-y:auto;padding:20px 24px}
.modal-footer{display:flex;gap:12px;padding:16px 24px calc(20px + env(safe-area-inset-bottom));border-top:1px solid var(--border)}
.modal-footer .btn{flex:1;padding:14px}

#toast{position:fixed;left:50%;bottom:100px;transform:translateX(-50%) translateY(10px);background:rgba(0,0,0,.85);color:#fff;padding:12px 20px;border-radius:10px;font-size:13px;opacity:0;pointer-events:none;transition:.3s;z-index:9999;max-width:80vw;text-align:center}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* 底栏 */
.bottom-bar{flex:0 0 auto;display:flex;height:64px;background:var(--bg);border-top:1px solid var(--border);z-index:30}
.nav-item{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:var(--sub);font-size:10px}
.nav-item.active{color:var(--text)}
.nav-item svg{width:22px;height:22px}
</style>
</head>
<body>

<div class="app">
  <header class="app-header">
    <div style="width:40px"></div>
    <div class="header-title" id="headerTitle">搜索</div>
    <button class="icon-btn" id="themeQuickBtn">☀</button>
  </header>
  
  <main class="page-container">
    <!-- 搜索生成页 -->
    <section class="page active" id="page-search">
      <div class="search-bar">
        <input type="text" placeholder="搜索标签、灵感...">
      </div>
      <div id="tagGroups"></div>
      <button class="btn btn-primary btn-block" id="openGenerateBtn">生成同人文</button>
    </section>

    <!-- 书架页 -->
    <section class="page" id="page-shelf">
      <div class="shelf-header"><span id="shelfCount"></span><span>点击阅读</span></div>
      <div id="shelfList"></div>
    </section>

    <!-- 设置页 -->
    <section class="page" id="page-settings">
      <!-- 库管理 (角色、面具、世界观、世界书) -->
      <div class="settings-section expanded" id="sec-char">
        <div class="section-header"><div><div class="section-title">角色库</div><div class="section-desc">管理多个角色卡设定</div></div><span class="chevron">⌄</span></div>
        <div class="section-body">
          <div class="item-list" id="list-char"></div>
          <button class="btn btn-outline btn-block" onclick="editLibItem('characters')">+ 新建角色卡</button>
        </div>
      </div>
      <div class="settings-section" id="sec-mask">
        <div class="section-header"><div><div class="section-title">User面具库</div><div class="section-desc">管理多个User设定</div></div><span class="chevron">⌄</span></div>
        <div class="section-body">
          <div class="item-list" id="list-mask"></div>
          <button class="btn btn-outline btn-block" onclick="editLibItem('masks')">+ 新建面具</button>
        </div>
      </div>
      <div class="settings-section" id="sec-wv">
        <div class="section-header"><div><div class="section-title">世界观设定</div><div class="section-desc">管理多个世界观</div></div><span class="chevron">⌄</span></div>
        <div class="section-body">
          <div class="item-list" id="list-wv"></div>
          <button class="btn btn-outline btn-block" onclick="editLibItem('worldviews')">+ 新建世界观</button>
        </div>
      </div>
      <div class="settings-section" id="sec-wb">
        <div class="section-header"><div><div class="section-title">世界书</div><div class="section-desc">管理多个世界书词条</div></div><span class="chevron">⌄</span></div>
        <div class="section-body">
          <div class="item-list" id="list-wb"></div>
          <button class="btn btn-outline btn-block" onclick="editLibItem('worldbooks')">+ 新建词条</button>
        </div>
      </div>

      <!-- API 配置 -->
      <div class="settings-section" id="sec-api">
        <div class="section-header"><div><div class="section-title">API 配置</div><div class="section-desc">OpenAI 兼容接口</div></div><span class="chevron">⌄</span></div>
        <div class="section-body">
          <div class="field"><label class="field-label">API URL</label><input type="text" id="apiUrl" class="text-input" placeholder="https://api.example.com/v1"></div>
          <div class="field"><label class="field-label">API 密钥</label><input type="password" id="apiKey" class="text-input" placeholder="sk-..."></div>
          <div class="field">
            <label class="field-label">模型名称</label>
            <div style="display:flex;gap:8px;">
              <input type="text" id="apiModel" class="text-input" placeholder="gpt-3.5-turbo" style="flex:1;">
              <button class="btn btn-outline" id="fetchModelsBtn" style="padding:0 12px;white-space:nowrap;">拉取</button>
            </div>
            <button class="btn btn-outline btn-block" id="openModelPickerBtn" style="display:none;margin-top:8px;">选择模型</button>
          </div>
          <button class="btn btn-outline btn-block" id="testApiBtn">测试连接</button>
        </div>
      </div>

      <!-- 外观与重置 -->
      <div class="settings-section" id="sec-appearance">
        <div class="section-header"><div><div class="section-title">外观与主题</div><div class="section-desc">全局主题</div></div><span class="chevron">⌄</span></div>
        <div class="section-body">
          <div class="segmented" id="themeSegmented">
            <button data-theme="day" class="active">日间</button>
            <button data-theme="night">夜间</button>
            <button data-theme="korean">韩系</button>
          </div>
        </div>
      </div>

      <div class="settings-section" style="background:transparent;box-shadow:none;margin-top:30px;">
        <button class="btn btn-danger-outline btn-block" id="clearAllDataBtn">清空所有本地数据（恢复出厂设置）</button>
      </div>
    </section>
  </main>

  <nav class="bottom-bar">
    <button class="nav-item active" data-page="search">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.5" y2="16.5"></line></svg><span>搜索</span>
    </button>
    <button class="nav-item" data-page="shelf">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path></svg><span>书架</span>
    </button>
    <button class="nav-item" data-page="settings">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg><span>设置</span>
    </button>
  </nav>
</div>

<!-- ====== 沉浸式阅读器 ====== -->
<div class="reader-overlay" id="readerOverlay">
  <div class="reader-header">
    <button class="icon-btn" id="readerBackBtn">
      <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 18 9 12 15 6"></polyline></svg>
    </button>
    <div class="reader-title" id="readerTitle">文章详情</div>
    <button class="icon-btn" id="readerSettingBtn">Aa</button>
  </div>
  <div class="reader-content-wrap">
    <div class="reader-content" id="readerContent"></div>
  </div>
  <div class="reader-footer">
    <button class="btn btn-outline" style="flex:1;border:none" onclick="document.getElementById('readerContent').scrollTo({top: document.getElementById('readerContent').scrollHeight, behavior: 'smooth'})">去续写</button>
  </div>

  <!-- 阅读器设置面板 -->
  <div class="reader-settings-panel" id="readerSettingsPanel">
    <div class="r-setting-row">
      <span class="r-setting-label">背景颜色</span>
      <div class="r-color-group" id="readerBgGroup">
        <button class="r-color-btn" style="background:#FFFFFF;" data-bg="#FFFFFF" data-txt="#111111"></button>
        <button class="r-color-btn" style="background:#F6F0E0;" data-bg="#F6F0E0" data-txt="#333333"></button>
        <button class="r-color-btn" style="background:#E3EDF2;" data-bg="#E3EDF2" data-txt="#222222"></button>
        <button class="r-color-btn" style="background:#121212;" data-bg="#121212" data-txt="#CCCCCC"></button>
      </div>
    </div>
    <div class="r-setting-row">
      <span class="r-setting-label">字号大小</span>
      <div style="display:flex;gap:10px;">
        <button class="btn btn-outline" onclick="changeReaderFontSize(-1)">A-</button>
        <button class="btn btn-outline" onclick="changeReaderFontSize(1)">A+</button>
      </div>
    </div>
    <div class="r-setting-row">
      <span class="r-setting-label">翻阅方式</span>
      <div class="segmented" id="readerModeGroup">
        <button data-mode="scroll" class="active">上下滑动</button>
        <button data-mode="page">左右翻页</button>
      </div>
    </div>
    <button class="btn btn-primary btn-block" style="margin-top:20px" onclick="closeReaderSettings()">完成</button>
  </div>
</div>

<!-- ====== 通用弹窗 ====== -->
<div class="modal-overlay" id="modalOverlay">
  <div class="modal">
    <div class="modal-header"><h2 id="modalTitle">标题</h2><button class="icon-btn" id="modalClose">✕</button></div>
    <div class="modal-body" id="modalBody"></div>
    <div class="modal-footer" id="modalFooter"></div>
  </div>
</div>
<div id="toast"></div>

<script>
/* ================= 基础工具 ================= */
const $ = s => document.querySelector(s);
const esc = s => String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
let toastT;
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('show'),3000);}

const THEMES = {
  day:{bg:'#FFFFFF',text:'#111111',sub:'#888888',card:'#F7F7F7',border:'#EAEAEA',accent:'#111111',onAccent:'#FFFFFF'},
  night:{bg:'#000000',text:'#EEEEEE',sub:'#666666',card:'#141414',border:'#222222',accent:'#FFFFFF',onAccent:'#000000'},
  korean:{bg:'#F4F4F4',text:'#222222',sub:'#999999',card:'#FFFFFF',border:'#EBEBEB',accent:'#333333',onAccent:'#FFFFFF'}
};
const TAGS = [
  {id:'world',title:'世界观',tags:['ABO','哨兵向导','星际','末日','修仙','西幻','现代都市','古代架空','娱乐圈','兽人']},
  {id:'rel',title:'关系设定',tags:['年上','年下','青梅竹马','破镜重圆','先婚后爱','追妻火葬场','强强','双强']},
  {id:'genre',title:'题材类型',tags:['娱乐圈','校园','职场','电竞','体育竞技','悬疑推理','无限流','系统']},
  {id:'gender',title:'性别组合',tags:['BG','BL','GL','GB','无CP','百合','耽美','言情']},
  {id:'style',title:'热门风格',tags:['甜宠','虐恋','沙雕','正剧','轻松','暗黑','治愈','致郁']}
];

/* ================= 状态管理 ================= */
const state = {
  theme:'day', selectedTags:{}, customTags:{}, shelf:[], apiUrl:'', apiKey:'', apiModel:'gpt-3.5-turbo',
  characters: [], masks: [], worldviews: [], worldbooks: []
};

function save(){try{localStorage.setItem('jj_v2',JSON.stringify(state))}catch(e){}}
function load(){
  try{
    const d=JSON.parse(localStorage.getItem('jj_v2'));
    if(d) Object.assign(state, d);
    // 数据兼容处理：如果旧版是字符串，转为数组
    ['characters','masks','worldviews','worldbooks'].forEach(k => {
      if(typeof state[k] === 'string') {
        if(state[k].trim()) state[k] = [{id:Date.now().toString(), title:'旧版数据', content:state[k]}];
        else state[k] = [];
      }
    });
  }catch(e){}
}

/* ================= 主题与页面切换 ================= */
function applyTheme(n){
  const t=THEMES[n]||THEMES.day; const r=document.documentElement.style;
  r.setProperty('--bg',t.bg);r.setProperty('--text',t.text);r.setProperty('--sub',t.sub);r.setProperty('--card',t.card);
  r.setProperty('--border',t.border);r.setProperty('--accent',t.accent);r.setProperty('--onAccent',t.onAccent);
  state.theme=n;
  document.querySelectorAll('#themeSegmented button').forEach(b=>b.classList.toggle('active',b.dataset.theme===n));
  $('#themeQuickBtn').textContent = n==='day'?'☀':n==='night'?'☾':'✿';
  save();
}
function switchPage(p){
  document.querySelectorAll('.page').forEach(el=>el.classList.toggle('active',el.id==='page-'+p));
  document.querySelectorAll('.nav-item').forEach(el=>el.classList.toggle('active',el.dataset.page===p));
  $('#headerTitle').textContent={search:'搜索',shelf:'书架',settings:'设置'}[p];
}

/* ================= 标签渲染 ================= */
function renderTags(){
  const w=$('#tagGroups');w.innerHTML='';
  TAGS.forEach(g=>{
    const sel=state.selectedTags[g.id]||[];
    const all=[...new Set([...g.tags, ...(state.customTags[g.id]||[])])];
    const box=document.createElement('div');box.className='tag-group';
    box.innerHTML=`<div class="tag-group-header"><span class="tag-group-title">${g.title}</span><button class="add-tag-btn">+ 自定义</button></div>`;
    box.querySelector('.add-tag-btn').onclick=()=>{
      const v=prompt('输入自定义标签');if(!v||!v.trim())return;
      state.customTags[g.id]=state.customTags[g.id]||[];
      if(!state.customTags[g.id].includes(v.trim())){state.customTags[g.id].push(v.trim());save();renderTags();}
    };
    const list=document.createElement('div');list.className='tag-list';
    all.forEach(t=>{
      const b=document.createElement('button');b.className='tag'+(sel.includes(t)?' active':'');b.textContent=t;
      b.onclick=()=>{
        state.selectedTags[g.id]=state.selectedTags[g.id]||[];
        const i=state.selectedTags[g.id].indexOf(t);
        if(i>=0)state.selectedTags[g.id].splice(i,1);else state.selectedTags[g.id].push(t);
        save();renderTags();
      };
      list.appendChild(b);
    });
    box.appendChild(list);w.appendChild(box);
  });
}

/* ================= 书库管理 ================= */
function renderLibs() {
  const renderList = (key, elId) => {
    const el = $('#'+elId);
    el.innerHTML = state[key].map(item => `
      <div class="item-card">
        <div class="item-info" onclick="editLibItem('${key}', '${item.id}')">
          <div class="item-title">${esc(item.title)}</div>
          <div class="item-desc">${esc(item.content.substring(0,20))}...</div>
        </div>
        <button class="item-del" onclick="delLibItem('${key}', '${item.id}')">删除</button>
      </div>
    `).join('');
  };
  renderList('characters','list-char');
  renderList('masks','list-mask');
  renderList('worldviews','list-wv');
  renderList('worldbooks','list-wb');
}

window.editLibItem = function(key, id = null) {
  const item = id ? state[key].find(x=>x.id===id) : {title:'', content:''};
  const body = `
    <div class="field"><label class="field-label">标题 / 名称</label><input type="text" id="libTitle" class="text-input" value="${esc(item.title)}" placeholder="例如：男主设定、末世背景"></div>
    <div class="field"><label class="field-label">详细内容</label><textarea id="libContent" class="text-area" rows="8" placeholder="填写具体设定...">${esc(item.content)}</textarea></div>
  `;
  openModal('编辑设定', body, [
    {label:'保存', type:'primary', onclick:()=>{
      const t = $('#libTitle').value.trim();
      const c = $('#libContent').value.trim();
      if(!t) return toast('请填写标题');
      if(id) {
        const target = state[key].find(x=>x.id===id);
        target.title = t; target.content = c;
      } else {
        state[key].push({id:Date.now().toString(), title:t, content:c});
      }
      save(); renderLibs(); closeModal(); toast('保存成功');
    }},
    {label:'取消', type:'outline', onclick:closeModal}
  ]);
}
window.delLibItem = function(key, id) {
  if(confirm('确定删除此设定吗？')) {
    state[key] = state[key].filter(x=>x.id!==id);
    save(); renderLibs();
  }
}

/* ================= 生成逻辑 ================= */
function getSysPrompt(selectedIds) {
  let s = '你是一位资深同人小说作者，擅长创作高质量中文小说。\n';
  s += '【绝对遵守规则】\n';
  s += '1. 必须严格按照用户提供的设定（角色卡、世界观、面具、世界书）进行生成，用户设定是底层逻辑且优先级最高。严禁出现与用户设定相冲突、相反的情节！\n';
  s += '2. 严格遵循设定的字数要求。如果故事未完结，你必须继续生成直到情节完整，绝对不允许中途截断！\n\n';
  
  const addStr = (key, label) => {
    const selected = state[key].filter(x => selectedIds.includes(x.id));
    if(selected.length) {
      s += `【${label}】\n`;
      selected.forEach(x => s += `- ${x.title}：\n${x.content}\n`);
      s += '\n';
    }
  };
  addStr('characters', '角色卡');
  addStr('masks', 'User面具');
  addStr('worldviews', '世界观设定');
  addStr('worldbooks', '世界书词条');
  return s;
}

async function callAI(msgs){
  const url=(state.apiUrl||'').trim(); if(!url)throw new Error('请先在设置中填写API URL');
  let ep=url.replace(/\/+$/,''); if(!/\/chat\/completions$/.test(ep))ep+='/chat/completions';
  const res=await fetch(ep,{method:'POST',headers:{'Content-Type':'application/json',...(state.apiKey?{'Authorization':'Bearer '+state.apiKey}:{})},body:JSON.stringify({model:state.apiModel||'gpt-3.5-turbo',messages:msgs,temperature:0.85,max_tokens:4096})});
  if(!res.ok)throw new Error('API请求失败('+res.status+')');
  const d=await res.json(); const txt=d?.choices?.[0]?.message?.content||d?.choices?.[0]?.text;
  if(!txt)throw new Error('API返回为空'); return txt.trim();
}

function openGenerateModal() {
  const tags = [];
  Object.values(state.selectedTags).forEach(arr => arr.forEach(t => { if (!tags.includes(t)) tags.push(t) }));
  if (!tags.length) return toast('请至少选择一个标签');
  
  // 构建勾选列表
  let checkHtml = '<div class="field"><label class="field-label">勾选本次使用的设定</label>';
  const buildChecks = (key, label) => {
    if(!state[key].length) return '';
    let h = `<div style="margin-top:8px;font-size:12px;color:var(--sub)">${label}:</div>`;
    h += state[key].map(x => `<label style="display:inline-flex;align-items:center;margin-right:12px;margin-top:4px;font-size:13px;"><input type="checkbox" value="${x.id}" data-group="${key}" style="margin-right:4px;"> ${esc(x.title)}</label>`).join('');
    return h;
  };
  checkHtml += buildChecks('characters', '角色') + buildChecks('masks', '面具') + buildChecks('worldviews', '世界观') + buildChecks('worldbooks', '世界书') + '</div>';

  const body = `
    ${checkHtml}
    <div class="field"><label class="field-label">每一篇章字数</label>
      <select class="select" id="mWordCount">
        <option value="1000">1000 字</option><option value="2000" selected>2000 字</option>
        <option value="3000">3000 字</option><option value="5000">5000 字</option>
      </select>
    </div>
    <div class="field"><label class="field-label">AI扩写指令（选填）</label>
      <textarea class="text-area" id="mExpand" rows="3" placeholder="例如：两人在雨夜重逢，气氛暧昧..."></textarea>
    </div>
    <div class="field" style="margin-bottom:0"><label class="field-label">严禁生成的内容<span style="color:#D93025">*</span></label>
      <textarea class="text-area" id="mForbidden" rows="2" placeholder="例如：政治敏感、暴力、OOC..."></textarea>
    </div>
  `;
  openModal('生成设置', body, [
    {label: '取消', type: 'outline', onclick: closeModal},
    {label: '开始生成', type: 'primary', onclick: ()=>handleGenerate(tags)}
  ]);
}

async function handleGenerate(tags) {
  const f = $('#mForbidden').value.trim();
  if (!f) return toast('请填写严禁生成的内容');
  const wc = $('#mWordCount').value, ex = $('#mExpand').value.trim();
  
  // 收集勾选的 ID
  const selectedIds = [];
  document.querySelectorAll('input[type="checkbox"]:checked').forEach(cb => selectedIds.push(cb.value));

  const btn = document.querySelector('#modalFooter .btn-primary');
  btn.disabled = true; btn.textContent = '生成中...';
  
  try {
    const p = `请创作约${wc}字同人小说。\n标签：${tags.join('、')}\n${ex ? '具体指令：' + ex + '\n' : ''}严禁内容：${f}\n要求：直接输出正文，不加标题解释。`;
    const txt = await callAI([{role: 'system', content: getSysPrompt(selectedIds)}, {role: 'user', content: p}]);
    
    const newArticle = { 
      id: 'a_' + Date.now(), 
      title: tags.slice(0,3).join('·') + '小说', 
      date: new Date().toLocaleDateString(), 
      content: txt, 
      history: [] 
    };
    state.shelf.unshift(newArticle); 
    save(); renderShelf();
    closeModal(); 
    toast('生成成功');
    openReader(newArticle.id);
  } catch (e) {
    toast(e.message);
    btn.disabled = false; btn.textContent = '开始生成';
  }
}

/* ================= 书架与阅读器 ================= */
function renderShelf(){
  const l=$('#shelfList');
  if(!state.shelf.length){l.innerHTML='<div class="empty-state" style="display:flex;"><p>书架空空如也</p></div>'; $('#shelfCount').textContent=''; return;}
  $('#shelfCount').textContent = `共 ${state.shelf.length} 篇`;
  l.innerHTML=state.shelf.map(a=>`
    <div class="shelf-item" data-id="${a.id}">
      <div class="shelf-cover">📖</div>
      <div class="shelf-info">
        <div class="shelf-title">${esc(a.title)}</div>
        <div class="shelf-meta">${a.date}</div>
      </div>
      <div class="shelf-actions">
        <button class="mini-btn danger" onclick="delArticle(event, '${a.id}')">删除</button>
      </div>
    </div>
  `).join('');
  document.querySelectorAll('.shelf-item').forEach(item=>{
    item.onclick = (e) => { if(!e.target.classList.contains('mini-btn')) openReader(item.dataset.id); };
  });
}
window.delArticle = (e, id) => {
  e.stopPropagation();
  if(confirm('确定删除这篇文章吗？')) {
    state.shelf = state.shelf.filter(x=>x.id!==id);
    save(); renderShelf();
  }
}

let currentArticleId = null;

function openReader(id) {
  const a = state.shelf.find(x=>x.id===id); if(!a) return;
  currentArticleId = id;
  $('#readerTitle').textContent = a.title;
  
  let html = `<div class="reader-text">${esc(a.content).replace(/\n/g, '<br>')}</div>`;
  html += `<div class="reader-append">`;
  html += `<h4>续写记录</h4>`;
  if(!a.history || !a.history.length) {
    html += `<div class="reader-history">暂无续写记录</div>`;
  } else {
    a.history.forEach(h => {
      html += `<div class="reader-history"><div class="dir">指令：${esc(h.dir)}</div>${esc(h.text).replace(/\n/g, '<br>')}</div>`;
    });
  }
  html += `<div class="field">
    <textarea id="readerContInput" class="reader-input" rows="3" placeholder="输入续写方向，例如：两人关系升温..."></textarea>
    <button class="btn btn-primary btn-block" onclick="handleContinue()">立即续写</button>
  </div></div>`;
  
  $('#readerContent').innerHTML = html;
  $('#readerContent').className = 'reader-content mode-' + readerSettings.mode;
  applyReaderTheme();
  
  $('#readerOverlay').classList.add('show');
  $('#readerContent').scrollTop = 0;
  $('#readerSettingsPanel').classList.remove('show');
}

window.closeReader = () => {
  $('#readerOverlay').classList.remove('show');
  currentArticleId = null;
}

async function handleContinue() {
  const dir = $('#readerContInput').value.trim();
  if(!dir) return toast('请输入续写方向');
  const a = state.shelf.find(x=>x.id===currentArticleId);
  if(!a) return;
  
  const btn = document.querySelector('#readerContent .btn-primary');
  btn.disabled = true; btn.textContent = '续写中...';
  
  try {
    const p = `以下是前文：\n${a.content}\n\n续写方向：${dir}\n要求保持文风，直接输出正文，不要截断。`;
    const txt = await callAI([{role:'system', content: getSysPrompt([])}, {role:'user', content: p}]);
    
    a.history = a.history || [];
    a.history.push({dir, text: txt});
    a.content += '\n\n' + txt;
    save(); renderShelf(); openReader(a.id);
    toast('续写成功');
  } catch(e) {
    toast(e.message);
    btn.disabled = false; btn.textContent = '立即续写';
  }
}

/* ================= 阅读器设置 ================= */
const readerSettings = { bg:'#FFFFFF', text:'#111111', fs:16, mode:'scroll' };

function openReaderSettings() { $('#readerSettingsPanel').classList.add('show'); }
function closeReaderSettings() { $('#readerSettingsPanel').classList.remove('show'); }

function applyReaderTheme() {
  const rc = $('#readerContent');
  $('#readerOverlay').style.background = readerSettings.bg;
  $('#readerOverlay').style.color = readerSettings.text;
  rc.style.fontSize = readerSettings.fs + 'px';
  document.querySelectorAll('#readerBgGroup .r-color-btn').forEach(b => {
    b.classList.toggle('active', b.dataset.bg === readerSettings.bg);
  });
}
function changeReaderFontSize(step) {
  readerSettings.fs = Math.min(26, Math.max(12, readerSettings.fs + step));
  applyReaderTheme();
}

/* ================= 系统弹窗与初始化 ================= */
function openModal(title,body,actions){
  $('#modalTitle').textContent=title;
  const b=$('#modalBody'); b.innerHTML=typeof body==='string'?body:'';
  const f=$('#modalFooter'); f.innerHTML='';
  (actions||[]).forEach(a=>{
    const btn=document.createElement('button');btn.className='btn '+(a.type==='primary'?'btn-primary':'btn-outline');btn.textContent=a.label;
    btn.onclick=a.onclick; f.appendChild(btn);
  });
  $('#modalOverlay').classList.add('show');
}
function closeModal(){$('#modalOverlay').classList.remove('show')}

function init(){
  load();
  applyTheme(state.theme);
  renderTags(); renderLibs(); renderShelf();
  
  document.querySelectorAll('.nav-item').forEach(b=>b.onclick=()=>switchPage(b.dataset.page));
  document.querySelectorAll('.section-header').forEach(h=>h.onclick=()=>h.parentElement.classList.toggle('expanded'));
  
  $('#themeQuickBtn').onclick=()=>applyTheme(state.theme==='day'?'night':state.theme==='night'?'korean':'day');
  document.querySelectorAll('#themeSegmented button').forEach(b=>b.onclick=()=>applyTheme(b.dataset.theme));
  $('#modalClose').onclick=closeModal;
  
  $('#openGenerateBtn').onclick = openGenerateModal;
  
  // API 设定
  $('#apiUrl').value=state.apiUrl; $('#apiKey').value=state.apiKey; $('#apiModel').value=state.apiModel;
  $('#apiUrl').oninput=e=>{state.apiUrl=e.target.value;save()};
  $('#apiKey').oninput=e=>{state.apiKey=e.target.value;save()};
  $('#apiModel').oninput=e=>{state.apiModel=e.target.value;save()};
  
  // 阅读器事件
  $('#readerBackBtn').onclick = closeReader;
  $('#readerSettingBtn').onclick = openReaderSettings;
  
  document.querySelectorAll('#readerBgGroup .r-color-btn').forEach(b => {
    b.onclick = () => { readerSettings.bg = b.dataset.bg; readerSettings.text = b.dataset.txt; applyReaderTheme(); };
  });
  document.querySelectorAll('#readerModeGroup button').forEach(b => {
    b.onclick = () => {
      document.querySelectorAll('#readerModeGroup button').forEach(x=>x.classList.remove('active'));
      b.classList.add('active');
      readerSettings.mode = b.dataset.mode;
      $('#readerContent').className = 'reader-content mode-' + readerSettings.mode;
    };
  });

  // 数据重置
  $('#clearAllDataBtn').onclick = () => {
    if (confirm('⚠️ 警告！\n\n将清空所有文章、设定和配置，且无法恢复。确定吗？')) {
      localStorage.removeItem('jj_v2'); location.reload();
    }
  };
  
  // 模拟 API 拉取(略去复杂的逻辑，保留按钮)
  $('#fetchModelsBtn').onclick = () => toast('已跳过拉取，请直接输入模型名');
  $('#testApiBtn').onclick = async () => {
    const b=$('#testApiBtn');b.textContent='测试中...';b.disabled=true;
    try{ await callAI([{role:'user',content:'回复正常'}]); toast('连接成功'); }
    catch(e){ toast('失败:'+e.message); }
    b.textContent='测试连接';b.disabled=false;
  };
}

document.addEventListener('DOMContentLoaded', init);
</script>
<script>
if ('serviceWorker' in navigator) { navigator.serviceWorker.register('./sw.js').catch(console.error); }
</script>
</body>
</html>
