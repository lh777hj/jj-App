<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>晋江同人创作馆</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  
  /* ======= 开屏动画 ======= */
  #splash {
    position: fixed; inset: 0; z-index: 9999; background-color: #F7F8FA;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.08'/%3E%3C/svg%3E");
    display: flex; align-items: center; justify-content: center; opacity: 0;
    animation: splashFadeIn 0.5s ease-out forwards; overflow: hidden;
  }
  #splash.fade-out { opacity: 0 !important; transition: opacity 0.8s ease-in-out; pointer-events: none; }
  @keyframes splashFadeIn { to { opacity: 1; } }
  .snow-container { position: absolute; inset: 0; pointer-events: none; z-index: 1; }
  .snowflake { position: absolute; background-color: #fff; border-radius: 50%; top: -10px; opacity: 0.8; animation: fall linear infinite; box-shadow: 0 0 2px rgba(255,255,255,0.8); }
  @keyframes fall { to { transform: translateY(105vh) translateX(20px); } }
  .art-container { position: relative; width: 90%; height: 400px; max-width: 500px; z-index: 2; }
  .scattered-char {
    position: absolute; font-family: "STXingkai", "Xingkai SC", "行楷", "Kaiti SC", "STKaiti", "KaiTi", serif;
    font-weight: bold; color: #1A1A1A; line-height: 1; pointer-events: none; opacity: 0; animation: inkFadeIn 0.2s ease-out forwards;
  }
  .scattered-char::after { content: attr(data-char); position: absolute; inset: 0; color: rgba(0,0,0,0.3); z-index: -1; filter: blur(3px); }
  @keyframes inkFadeIn { to { opacity: var(--final-opacity); } }

  /* ======= 主界面主题变量 ======= */
  :root{
    --bg:#FFFFFF; --text:#333333; --card:#F5F5F5; --border:#E0E0E0;
    --accent:#4A4A4A; --sub:#999999;
    --input-bg:var(--card); --input-border:var(--border);
    --btn-sec-bg:var(--card); --btn-sec-text:var(--text);
    --tag-bg:var(--card); --tag-text:var(--text); --tag-border:var(--border);
    --section-bg:var(--card);
    --btn-primary-bg:var(--accent); --btn-primary-text:#fff;
    --font-family:"Kaiti SC","STKaiti","KaiTi","楷体","Kaiti",serif;
    --radius-card:16px; --radius-btn:14px; --card-shadow:none;
    /* 聊天UI变量 */
    --chat-user-bg:#4A4A4A; --chat-user-text:#FFF;
    --chat-char-bg:#F5F5F5; --chat-char-text:#333;
  }
  
  [data-theme="night"]{
    --bg:#121212; --text:#E0E0E0; --card:#1E1E1E; --border:#333333;
    --accent:#B0B0B0; --sub:#888888; --btn-primary-text:#121212;
    --chat-user-bg:#B0B0B0; --chat-user-text:#121212;
    --chat-char-bg:#1E1E1E; --chat-char-text:#E0E0E0;
  }
  
  [data-theme="korean"]{
    --bg:#FAFAFA; --text:#1A1A1A; --card:#FFFFFF; --border:#F0F0F0;
    --accent:#A8A29E; --sub:#78716C;
    --input-bg:#FFFFFF; --input-border:#E7E5E4;
    --btn-sec-bg:#F5F5F4; --btn-sec-text:#1A1A1A;
    --tag-bg:#F5F5F4; --tag-text:#57534E; --tag-border:transparent;
    --section-bg:#FAFAFA;
    --btn-primary-bg:#1A1A1A; --btn-primary-text:#FFFFFF;
    --font-family:"Pretendard", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    --radius-card:8px; --radius-btn:6px; --card-shadow:0 1px 2px rgba(0,0,0,0.04);
    --chat-user-bg:#1A1A1A; --chat-user-text:#FFF;
    --chat-char-bg:#F5F5F4; --chat-char-text:#1A1A1A;
  }

  html,body{height:100%}
  body{
    font-family:var(--font-family); background:#1c1c1e;
    display:flex; justify-content:center; align-items:center;
    color:var(--text); transition:background .3s,color .3s,font-family .3s;
  }
  
  .phone{
    width:390px; height:844px; background:var(--bg);
    display:flex; flex-direction:column;
    border-radius:44px; overflow:hidden;
    box-shadow:0 24px 70px rgba(0,0,0,.55);
    position:relative; transition:background .3s;
  }
  @media (max-width:460px){
    body{display:block;background:var(--bg)}
    .phone{width:100%;height:100vh;height:100dvh;border-radius:0;box-shadow:none}
    .art-container{height: 300px;}
  }

  /* ======= 侧边抽屉 (Drawer) ======= */
  .drawer-overlay {
    position: absolute; inset: 0; background: rgba(0,0,0,0.5);
    z-index: 100; opacity: 0; pointer-events: none; transition: opacity 0.3s;
  }
  .drawer-overlay.active { opacity: 1; pointer-events: auto; }

  .drawer {
    position: absolute; top: 0; bottom: 0; left: 0;
    width: 75%; max-width: 300px; background: var(--bg);
    z-index: 101; transform: translateX(-100%);
    transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    display: flex; flex-direction: column;
    box-shadow: 4px 0 24px rgba(0,0,0,0.1);
    border-right: 1px solid var(--border);
  }
  .drawer.active { transform: translateX(0); }
  
  .drawer-header {
    padding: 40px 20px 20px; border-bottom: 1px solid var(--border);
  }
  .drawer-header h2 { font-size: 18px; font-weight: 700; color: var(--text); }

  .drawer-menu { padding: 12px; flex: 1; overflow-y: auto; }
  .drawer-item {
    display: flex; align-items: center; gap: 12px;
    padding: 14px 16px; border-radius: 12px; color: var(--text);
    cursor: pointer; transition: background 0.2s; margin-bottom: 4px;
  }
  .drawer-item:active { background: var(--card); }
  .drawer-item svg { color: var(--sub); }
  .drawer-item.active {
    background: var(--card); font-weight: 600;
  }
  .drawer-item.active svg { color: var(--text); }
  .di-title { font-size: 15px; }
  .di-desc { font-size: 11px; color: var(--sub); margin-top: 2px; }

  /* 顶栏 */
  .topbar{
    height:48px; flex-shrink:0; display:flex; align-items:center; justify-content:space-between;
    padding:0 20px; color:var(--text); transition:color .3s;
  }
  .tb-left{font-size:14px;font-weight:600;letter-spacing:.5px;min-width:56px}
  .tb-center{font-size:16px;font-weight:400;letter-spacing:1px}
  .tb-right{display:flex;align-items:center;gap:5px;min-width:56px;justify-content:flex-end}
  .tb-right svg{display:block}

  /* 内容区 */
  .content{flex:1;overflow-y:auto;padding:4px 18px 24px;-webkit-overflow-scrolling:touch; position:relative;}
  .content::-webkit-scrollbar{display:none}
  .page{display:none;animation:fade .22s ease; height: 100%;}
  .page.active{display:block}
  @keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

  /* 页面头部与汉堡按钮 */
  .page-head-wrap {
    display: flex; align-items: center; margin:8px 0 18px; gap: 12px;
  }
  .hamburger {
    width: 32px; height: 32px; display: flex; flex-direction: column; justify-content: center; gap: 4px;
    cursor: pointer; padding: 4px;
  }
  .hamburger span {
    display: block; width: 100%; height: 2px; background: var(--text); border-radius: 2px;
  }
  
  .page-head{margin:0; flex:1;}
  .page-head h1{font-size:22px;font-weight:700;letter-spacing:1px}
  .page-head p{font-size:12px;color:var(--sub);margin-top:6px;line-height:1.5;transition:color .3s}
  .page-head-normal { margin: 8px 0 18px; }

  /* 标签 */
  .tag-cat{margin-bottom:18px}
  .tag-cat-title{font-size:12px;color:var(--sub);letter-spacing:2px;margin-bottom:10px;transition:color .3s}
  .tags{display:flex;flex-wrap:wrap;gap:8px}
  .tag{
    padding:7px 15px;border-radius:16px; background:var(--tag-bg);border:1px solid var(--tag-border);
    color:var(--tag-text);font-size:13px;font-family:inherit; cursor:pointer;transition:all .15s;user-select:none;
  }
  [data-theme="korean"] .tag{border-radius:6px;padding:6px 14px}
  .tag:active{transform:scale(.94)}
  .tag.on{ background:var(--accent);border-color:var(--accent); color:var(--btn-primary-text); }
  [data-theme="day"] .tag.on{color:#fff}
  [data-theme="korean"] .tag.on{background:#1A1A1A;color:#fff}

  /* 表单与输入框 */
  .custom-input,.sel-wrap select,.prompt-box,.form-input{
    width:100%;padding:12px 14px;border-radius:12px; background:var(--input-bg);border:1px solid var(--input-border);
    color:var(--text);font-size:14px;font-family:inherit; outline:none;transition:all .2s;
  }
  [data-theme="korean"] .custom-input, [data-theme="korean"] .sel-wrap select,
  [data-theme="korean"] .prompt-box, [data-theme="korean"] .form-input{border-radius:6px}
  .custom-input:focus,.sel-wrap select:focus,.prompt-box:focus,.form-input:focus{ border-color:var(--accent); }
  .custom-input::placeholder,.prompt-box::placeholder,.form-input::placeholder{ color:var(--sub); }
  .hide-text { -webkit-text-security: disc; text-security: disc; }
  
  .field{margin-bottom:14px}
  .field label{display:block;font-size:12px;color:var(--sub);margin-bottom:7px;letter-spacing:1px;transition:color .3s}
  .sel-wrap{position:relative}
  .sel-wrap::after{
    content:"";position:absolute;right:14px;top:50%; width:7px;height:7px;border-right:1.5px solid var(--sub);
    border-bottom:1.5px solid var(--sub); transform:translateY(-70%) rotate(45deg);pointer-events:none;
  }
  .sel-wrap select{-webkit-appearance:none;appearance:none;padding-right:34px}
  .prompt-box{resize:none;height:76px;line-height:1.5}

  /* 按钮 */
  .btn-primary{
    width:100%;padding:15px;border-radius:var(--radius-btn); background:var(--btn-primary-bg);color:var(--btn-primary-text);border:none;
    font-size:16px;font-weight:700;font-family:inherit;letter-spacing:2px; cursor:pointer;margin-top:22px;transition:all .2s;
  }
  .btn-primary:active{ background:#3A3A3A; transform:scale(.98); }
  [data-theme="night"] .btn-primary:active{background:#999}
  [data-theme="korean"] .btn-primary:active{background:#333}

  .btn-secondary{
    padding:10px 20px;border-radius:var(--radius-btn); background:var(--btn-sec-bg);border:1px solid var(--input-border);
    color:var(--btn-sec-text);font-size:13px;font-family:inherit;cursor:pointer; transition:all .2s;
  }
  .btn-secondary:active{transform:scale(.97)}
  .btn-row{display:flex;gap:10px;margin-top:10px}
  .btn-row .btn-secondary{flex:1;text-align:center;justify-content:center}

  /* 书架 */
  .empty-card{
    text-align:center;padding:44px 20px 36px; background:var(--card);border:1px solid var(--border);
    border-radius:var(--radius-card);margin-bottom:20px; box-shadow:var(--card-shadow);transition:all .3s;
  }
  .empty-card .ico{color:var(--sub);opacity:.55;margin-bottom:16px}
  .empty-card p{font-size:13px;color:var(--sub);line-height:1.7;margin-bottom:20px}

  .panel{
    background:var(--card);border:1px solid var(--border); border-radius:var(--radius-card);padding:18px 16px;margin-bottom:16px;
    box-shadow:var(--card-shadow);transition:all .3s;
  }
  .panel-title{font-size:15px;font-weight:700;letter-spacing:1px;margin-bottom:16px}

  .hist-title{font-size:11px;color:var(--sub);margin:14px 0 8px;letter-spacing:1px}
  .hist-chips{display:flex;flex-wrap:wrap;gap:6px}
  .hist-chip{
    font-size:11px;padding:4px 10px;border-radius:10px; background:var(--input-bg);border:1px solid var(--input-border);color:var(--sub);
    max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  }
  .hist-empty{font-size:11px;color:var(--sub);opacity:.7}

  /* 设置页 */
  .theme-card{
    display:flex;flex-direction:column;gap:12px; background:var(--card);border:1px solid var(--border);
    border-radius:var(--radius-card);padding:14px 16px;margin-bottom:12px; box-shadow:var(--card-shadow);transition:all .3s;
  }
  .tc-top{display:flex;align-items:center;justify-content:space-between;}
  .tc-title{font-size:14px;font-weight:600;margin-bottom:3px}
  .tc-desc{font-size:11px;color:var(--sub)}
  
  .seg{display:flex;background:var(--input-bg);border:1px solid var(--input-border);border-radius:10px;overflow:hidden;width:100%}
  .seg button{
    flex:1;border:none;background:transparent;color:var(--sub); font-size:12px;font-family:inherit;padding:8px 0;cursor:pointer;transition:all .2s;
  }
  [data-theme="korean"] .seg{border-radius:6px}
  [data-theme="korean"] .seg button.on{background:#1A1A1A;color:#fff}
  .seg button.on{background:var(--accent);color:var(--btn-primary-text)}
  [data-theme="day"] .seg button.on{color:#fff}

  .section{
    background:var(--section-bg);border:1px solid var(--border); border-radius:var(--radius-card);margin-bottom:10px;overflow:hidden;
    box-shadow:var(--card-shadow);transition:all .3s;
  }
  .section-header{
    padding:15px 16px;display:flex;align-items:center;justify-content:space-between; cursor:pointer;user-select:none;
  }
  .sh-left{display:flex;flex-direction:column;gap:4px;padding-right:12px}
  .sh-title{font-size:14px;font-weight:600;letter-spacing:.5px}
  .sh-desc{font-size:11px;color:var(--sub);line-height:1.4}
  .sh-arrow{
    width:7px;height:7px;flex-shrink:0; border-right:1.5px solid var(--sub);border-bottom:1.5px solid var(--sub);
    transform:rotate(-45deg);transition:transform .25s;
  }
  .section.open .sh-arrow{transform:rotate(45deg)}
  .section-body{display:none;padding:0 16px 16px;border-top:1px dashed transparent;}
  .section.open .section-body{display:block;padding-top:12px;border-top-color:var(--border);}

  .item{
    background:var(--input-bg);border:1px solid var(--input-border); border-radius:10px;padding:12px;margin-bottom:8px;transition:all .3s;
  }
  [data-theme="korean"] .item{border-radius:6px}
  .item-title{font-size:13px;font-weight:600;margin-bottom:5px}
  .item-desc{font-size:11px;color:var(--sub);line-height:1.55}
  .badge{
    display:inline-block;font-size:10px;padding:2px 8px; border-radius:8px;margin-top:7px;letter-spacing:.5px;
    background:var(--accent);color:#fff;opacity:.9;
  }
  [data-theme="day"] .badge{color:#fff}
  [data-theme="night"] .badge{color:#121212}
  [data-theme="korean"] .badge{background:#1A1A1A;color:#fff}
  .badge.user{background:var(--sub);color:#fff !important}
  
  .item-tags{display:flex;gap:4px;margin-top:6px;flex-wrap:wrap}
  .item-tag{font-size:10px;color:var(--accent);background:rgba(74,74,74,0.1);padding:2px 6px;border-radius:4px}
  [data-theme="korean"] .item-tag{color:#57534E;background:#F5F5F4}

  .add-btn{
    width:100%;padding:10px;border-radius:10px; background:transparent;border:1px dashed var(--input-border);
    color:var(--sub);font-size:12px;font-family:inherit;cursor:pointer; letter-spacing:1px;transition:all .2s;margin-top:4px;
  }
  .add-btn:active{border-color:var(--accent);color:var(--accent)}
  [data-theme="korean"] .add-btn{border-radius:6px}
  [data-theme="korean"] .add-btn:active{border-color:#1A1A1A;color:#1A1A1A}
  
  .model-empty{
    font-size:12px;color:var(--sub);text-align:center; padding:20px;border:1px dashed var(--input-border);border-radius:10px;margin-top:10px;
  }

  .fs-row{display:flex;align-items:center;gap:12px;margin-top:6px}
  .fs-row input[type=range]{flex:1;accent-color:var(--accent);height:4px}
  .fs-val{font-size:13px;font-weight:600;min-width:44px;text-align:right}
  .fs-preview{
    margin-top:14px;padding:14px;border-radius:10px; background:var(--input-bg);border:1px solid var(--input-border);
    font-size:16px;line-height:1.6;color:var(--sub);transition:all .3s;
  }

  /* ======= 捡手机 (聊天) 页面 - 严格按 JSON 要求使用 !important 修复 ======= */
  #page-pickUpPhone { 
    display: none !important; /* 默认强制隐藏 */
    padding: 0; background: var(--bg); height: 100%; 
    flex-direction: column;
    z-index: 1000;
    position: relative;
  }
  #page-pickUpPhone.active { 
    display: flex !important; /* 激活时强制显示 */
  }
  
  .chat-header {
    display: flex; align-items: center; padding: 12px 16px; gap: 12px;
    border-bottom: 1px solid var(--border); background: var(--card);
  }
  .chat-back {
    font-size: 24px; cursor: pointer; color: var(--text); line-height: 1;
    padding: 0 8px; margin-left: -8px;
  }
  .chat-title { display: flex; flex-direction: column; }
  .chat-title .c-name { font-size: 15px; font-weight: 600; }
  .chat-title .c-status { font-size: 11px; color: var(--sub); }
  
  .chat-body {
    flex: 1; padding: 16px; overflow-y: auto; display: flex; flex-direction: column; gap: 16px;
  }
  .msg { display: flex; }
  .msg.user { justify-content: flex-end; }
  .msg.char { justify-content: flex-start; }
  
  .msg-bubble {
    max-width: 75%; padding: 12px 16px; font-size: 14px; line-height: 1.5;
    border-radius: 12px; word-wrap: break-word;
  }
  .msg.user .msg-bubble {
    background: var(--chat-user-bg); color: var(--chat-user-text);
    border-bottom-right-radius: 4px;
  }
  .msg.char .msg-bubble {
    background: var(--chat-char-bg); color: var(--chat-char-text);
    border-bottom-left-radius: 4px; border: 1px solid var(--border);
  }

  .chat-input-area {
    padding: 12px 16px; background: var(--bg); border-top: 1px solid var(--border);
    display: flex; gap: 10px; align-items: center;
  }
  .chat-input {
    flex: 1; padding: 10px 14px; border-radius: 20px; background: var(--input-bg);
    border: 1px solid var(--input-border); color: var(--text); font-size: 14px; outline: none;
  }
  .chat-send {
    padding: 8px 16px; border-radius: 20px; background: var(--accent); color: var(--btn-primary-text);
    border: none; font-size: 14px; cursor: pointer; font-weight: 600;
  }
  [data-theme="day"] .chat-send { color: #fff; }

  /* 底部导航 */
  .bottom-nav{
    flex-shrink:0;display:flex; border-top:1px solid var(--border); background:var(--bg);
    padding:9px 0 26px; transition:all .3s;
  }
  .nav-item{
    flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;
    color:var(--sub);cursor:pointer;transition:all .15s;
    padding:4px 0; border-radius: 8px; margin: 0 4px;
  }
  .nav-item:active { background-color: #E8E8E8; }
  [data-theme="korean"] .nav-item:active { background-color: #F0F0F0; }
  [data-theme="night"] .nav-item:active { background-color: #333333; }
  .nav-item.active{color:var(--accent)}
  [data-theme="korean"] .nav-item.active{color:#1A1A1A}
  .nav-item .nav-label{font-size:11px;letter-spacing:1px}
  .nav-item svg{display:block; transition:stroke-width .3s;}
  [data-theme="korean"] .nav-item svg * {stroke-width: 1.2 !important;}

  /* Toast */
  .toast{
    position:fixed;left:50%;bottom:96px;transform:translate(-50%,16px); background:rgba(0,0,0,.82);color:#fff;padding:11px 22px;
    border-radius:22px;font-size:13px;font-family:inherit; opacity:0;transition:all .26s;pointer-events:none;z-index:999;
    max-width:80%;text-align:center;line-height:1.5;
  }
  .toast.show{opacity:1;transform:translate(-50%,0)}
</style>
</head>
<body>

<div id="splash">
  <div class="snow-container" id="snowContainer"></div>
  <div class="art-container" id="artContainer"></div>
</div>

<div class="phone" id="phone" data-theme="day">

  <!-- 侧边抽屉 -->
  <div class="drawer-overlay" id="drawerOverlay" onclick="closeDrawer()"></div>
  <div class="drawer" id="drawer">
    <div class="drawer-header">
      <h2>功能菜单</h2>
    </div>
    <div class="drawer-menu">
      <div class="drawer-item" id="menu-pickUpPhone" onclick="switchTab('pickUpPhone')">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
        </svg>
        <div>
          <div class="di-title">捡手机玩法</div>
          <div class="di-desc">模拟聊天生成对话</div>
        </div>
      </div>
      <div class="drawer-item active" id="menu-search" onclick="switchTab('search')">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
          <circle cx="10.8" cy="10.8" r="7"/><line x1="16" y1="16" x2="21" y2="21"/>
        </svg>
        <div>
          <div class="di-title">标准搜索</div>
          <div class="di-desc">传统同人文生成</div>

/* ================= 续写提示历史 ================= */
let history = [];
const histBox = document.getElementById('histBox');
const promptInput = document.getElementById('promptInput');

promptInput.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); addPrompt(); }
});

function addPrompt(){
  const v = promptInput.value.trim();
  if (!v) return;
  history.unshift(v);
  if (history.length > 10) history.pop();
  promptInput.value = '';
  renderHistory(); toast('已记录续写提示');
}

function renderHistory(){
  if (!history.length){
    histBox.innerHTML = '<span class="hist-empty">暂无续写记录</span>'; return;
  }
  histBox.innerHTML = history.map((h, i) => '<span class="hist-chip">' + (i + 1) + '. ' + escapeHTML(h) + '</span>').join('');
}

function escapeHTML(s){
  return s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

    addText:'上传自定义壁纸（jpg / png / webp，≤10MB）'
  },
  {
    id:'font', name:'自定义字体', desc:'选择或上传App显示字体',
    items:[
      { name:'当前字体：原生楷体', type:'', desc:'可选：原生楷体 / Pretendard / 思源宋体 / 方正兰亭黑 / 华文楷体' }
    ],
    addText:'上传自定义字体（ttf / otf，≤20MB）'
  },
  {
    id:'fontSize', name:'自定义字号大小', desc:'调整阅读和界面文字的大小',
    isFontSize:true
  }
];

const settingsList = document.getElementById('settingsList');

SETTINGS.forEach(sec => {
  const div = document.createElement('div');
  div.className = 'section';

  let body = '';
  if (sec.isFontSize){
    body = `
      <div class="fs-row">
        <span style="font-size:11px;color:var(--sub)">12</span>
        <input type="range" id="fsRange" min="12" max="24" step="1" value="16">
        <span style="font-size:11px;color:var(--sub)">24</span>
      </div>
      <div class="fs-row" style="margin-top:10px">
        <span style="font-size:12px;color:var(--sub)">当前字号</span>
        <div class="fs-val" style="margin-left:auto"><span id="fsVal">16</span> px</div>
      </div>
      <div class="fs-preview" id="fsPreview">预览：晋江文学城，与你共赏好文。</div>
    `;
  } else if (sec.isCustomHTML) {
    body = sec.html;
  } else {
    body = sec.items.map(it => `
      <div class="item">
        <div class="item-title">${it.name}</div>
        <div class="item-desc">${it.desc}</div>
        ${it.type ? `<span class="badge ${it.type === '用户自建' ? 'user' : ''}">${it.type}</span>` : ''}
      </div>
    `).join('') + `<button class="add-btn" onclick="toast('${sec.addText}')">${sec.addText}</button>`;
  }

  div.innerHTML = `
    <div class="section-header" onclick="this.parentElement.classList.toggle('open')">
      <div class="sh-left">
        <div class="sh-title">${sec.name}</div>
        <div class="sh-desc">${sec.desc}</div>
      </div>
      <div class="sh-arrow"></div>
    </div>
    <div class="section-body">${body}</div>
  `;
  settingsList.appendChild(div);
});

/* 默认展开第一个 */
document.querySelector('.section').classList.add('open');

/* 字号滑块联动 */
document.addEventListener('input', function(e) {
  if(e.target.id === 'fsRange') {
    const v = e.target.value;
    document.getElementById('fsVal').textContent = v;
    document.getElementById('fsPreview').style.fontSize = v + 'px';
  }
});

/* ================= Toast ================= */
let toastTimer;
function toast(msg){
  let t = document.getElementById('toast');
  if (!t){
    t = document.createElement('div'); t.id = 'toast'; t.className = 'toast'; document.body.appendChild(t);
  }
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 1900);
}
</script>
</body>
</html>
