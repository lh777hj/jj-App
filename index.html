<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>晋江同人文生成器</title>

<!-- PWA 核心 Meta -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#FFFFFF">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
  /* ================= 核心变量与主题 ================= */
  :root {
    --app-font-family: 'Kaiti SC', 'STKaiti', 'KaiTi', '楷体', serif;
    --app-font-size: 16px;
    --bg: #FFFFFF; --text: #333333; --card: #F5F5F5; --border: #E0E0E0;
    --accent: #444444; --accentLight: #888888; --icon: #666666; --iconActive: #333333;
  }
  [data-theme="night"] {
    --bg: #121212; --text: #E0E0E0; --card: #1E1E1E; --border: #333333;
    --accent: #BBBBBB; --accentLight: #777777; --icon: #999999; --iconActive: #E0E0E0;
  }
  [data-theme="korean"] {
    --bg: #FAFAFA; --text: #1A1A1A; --card: #FFFFFF; --border: #F0F0F0;
    --accent: #555555; --accentLight: #999999; --icon: #777777; --iconActive: #1A1A1A;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; font-family: var(--app-font-family) !important; -webkit-tap-highlight-color: transparent; }
  html, body { width: 100vw; height: 100vh; overflow: hidden; background: #1c1c1e; display: flex; justify-content: center; align-items: center; }
  
  .app-container { width: 100%; height: 100%; max-width: 480px; background: var(--bg); color: var(--text); font-size: var(--app-font-size); display: flex; flex-direction: column; position: relative; overflow: hidden; transition: background 0.3s, color 0.3s; }
  @media(min-width: 1024px) { .app-container { width: 390px; height: 844px; border-radius: 40px; border: 8px solid #1A1A1A; box-shadow: 0 0 40px rgba(0,0,0,0.5); } }

  /* ================= 顶栏 ================= */
  .topbar { height: 48px; flex-shrink: 0; display: flex; justify-content: space-between; align-items: center; padding: 0 16px; font-size: 14px; font-weight: 600; border-bottom: 1px solid var(--border); padding-top: env(safe-area-inset-top); z-index: 10; background: var(--bg); }
  .menu-btn { width: 20px; height: 14px; display: flex; flex-direction: column; justify-content: space-between; cursor: pointer; }
  .menu-btn span { display: block; width: 100%; height: 1.5px; background: var(--text); border-radius: 1px; }
  .tb-right { display: flex; gap: 6px; align-items: center; }
  .tb-signal { display: flex; gap: 2px; align-items: flex-end; height: 10px; }
  .tb-signal i { display: block; width: 3px; background: var(--text); border-radius: 1px; }
  .tb-signal i:nth-child(1) { height: 4px; }
  .tb-signal i:nth-child(2) { height: 6px; }
  .tb-signal i:nth-child(3) { height: 8px; }
  .tb-battery { width: 22px; height: 11px; border: 1px solid var(--text); border-radius: 3px; padding: 1px; opacity: 0.8; }
  .tb-battery::after { content: ""; display: block; width: 100%; height: 100%; background: var(--text); border-radius: 1px; }

  /* ================= 页面容器 ================= */
  .content { flex: 1; overflow-y: auto; padding: 16px 20px 80px; position: relative; background: var(--bg); }
  .page { display: none; animation: fade .22s ease; }
  .page.active { display: block; }
  @keyframes fade { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

  h1 { font-size: 22px; margin-bottom: 16px; font-weight: bold; }

  /* ================= 表单与按钮 ================= */
  input, select, textarea { width: 100%; padding: 12px; border-radius: 10px; background: var(--card); border: 1px solid var(--border); color: var(--text); font-size: 14px; margin-bottom: 12px; outline: none; transition: border 0.2s; }
  input:focus, textarea:focus, select:focus { border-color: var(--accent); }
  textarea { resize: none; height: 80px; line-height: 1.5; }
  label { display: block; font-size: 12px; color: var(--accentLight); margin-bottom: 6px; }
  
  /* 防安全键盘伪装 */
  .hide-text { -webkit-text-security: disc; text-security: disc; }

  .btn-primary { width: 100%; padding: 14px; border-radius: 12px; background: var(--accent); color: var(--bg); border: none; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 10px; }
  .btn-primary:active { opacity: 0.8; }
  .btn-outline { width: 100%; padding: 14px; border-radius: 12px; background: transparent; border: 1px solid var(--border); color: var(--text); font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 10px; }
  .btn-sec { padding: 10px 12px; border-radius: 8px; background: var(--card); border: 1px solid var(--border); color: var(--text); font-size: 13px; cursor: pointer; }
  .btn-row { display: flex; gap: 10px; margin-top: 10px; }
  .btn-row button { flex: 1; }

  /* ================= 标签组 ================= */
  .tag-group { margin-bottom: 16px; }
  .tag-group-title { font-size: 13px; color: var(--accentLight); margin-bottom: 8px; font-weight: 600; }
  .tags { display: flex; flex-wrap: wrap; gap: 8px; }
  .tag { padding: 6px 14px; border-radius: 16px; background: var(--card); border: 1px solid var(--border); font-size: 13px; cursor: pointer; user-select: none; transition: all 0.15s; }
  .tag.on { background: var(--accent); color: var(--bg); border-color: var(--accent); }

  /* ================= 卡片与列表 ================= */
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 16px; margin-bottom: 12px; }
  .card-title { font-size: 15px; font-weight: bold; margin-bottom: 8px; }
  .card-desc { font-size: 12px; color: var(--accentLight); margin-bottom: 12px; }

  /* ================= 底部导航 ================= */
  .bottom-nav { height: 60px; background: var(--bg); border-top: 1px solid var(--border); display: flex; position: absolute; bottom: 0; width: 100%; padding-bottom: env(safe-area-inset-bottom); z-index: 10; }
  .nav-item { flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; color: var(--icon); font-size: 11px; cursor: pointer; transition: color 0.2s; }
  .nav-item.active { color: var(--iconActive); font-weight: bold; }
  .nav-item svg { width: 22px; height: 22px; margin-bottom: 3px; fill: currentColor; }

  /* ================= 侧边抽屉 ================= */
  .drawer-overlay { position: absolute; inset: 0; background: rgba(0,0,0,0.5); z-index: 50; opacity: 0; pointer-events: none; transition: opacity 0.3s; }
  .drawer-overlay.active { opacity: 1; pointer-events: auto; }
  .drawer { position: absolute; top: 0; left: -75%; width: 75%; height: 100%; background: var(--bg); z-index: 51; transition: left 0.3s cubic-bezier(0.4, 0, 0.2, 1); padding: 20px; border-right: 1px solid var(--border); }
  .drawer.active { left: 0; }
  .drawer-header { font-size: 18px; font-weight: bold; margin-bottom: 24px; }
  .drawer-item { padding: 16px 12px; font-size: 15px; border-bottom: 1px solid var(--border); cursor: pointer; display: flex; align-items: center; gap: 12px; }
  .drawer-item svg { width: 20px; height: 20px; fill: currentColor; }

  /* ================= Modal 弹窗 ================= */
  .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.6); z-index: 100; display: none; align-items: center; justify-content: center; padding: 20px; }
  .modal-overlay.active { display: flex; }
  .modal-content { background: var(--bg); width: 100%; max-width: 400px; border-radius: 16px; padding: 20px; display: flex; flex-direction: column; box-shadow: 0 10px 30px rgba(0,0,0,0.2); }
  .modal-title { font-size: 18px; font-weight: bold; margin-bottom: 12px; }
  .modal-desc { font-size: 13px; color: var(--accentLight); margin-bottom: 16px; }
  
  /* 聊天记录特供 */
  .chat-box { background: var(--card); border-radius: 12px; height: 250px; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 12px; margin-bottom: 16px; border: 1px solid var(--border); }
  .msg { max-width: 80%; padding: 10px 14px; border-radius: 12px; font-size: 14px; line-height: 1.5; }
  .msg.left { align-self: flex-start; background: var(--bg); border: 1px solid var(--border); }
  .msg.right { align-self: flex-end; background: var(--accent); color: var(--bg); }

  /* ================= Toast ================= */
  .toast { position: fixed; bottom: 80px; left: 50%; transform: translateX(-50%) translateY(10px); background: rgba(0,0,0,0.8); color: #fff; padding: 10px 20px; border-radius: 20px; font-size: 14px; opacity: 0; pointer-events: none; transition: all 0.3s; z-index: 999; white-space: nowrap; }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>

<div class="app-container" id="app" data-theme="day">
  
  <!-- 侧边抽屉 -->
  <div class="drawer-overlay" id="drawerOverlay" onclick="toggleDrawer()"></div>
  <div class="drawer" id="drawer">
    <div class="drawer-header">更多功能</div>
    <div class="drawer-item" onclick="openModal('modal-phoneLiterature'); toggleDrawer()">
      <svg viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
      手机文学
    </div>
    <div class="drawer-item" onclick="openModal('modal-miniDrama'); toggleDrawer()">
      <svg viewBox="0 0 24 24"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>
      小短剧
    </div>
  </div>

  <!-- 顶栏 -->
  <div class="topbar">
    <div style="display:flex; align-items:center; gap: 12px;">
      <div class="menu-btn" onclick="toggleDrawer()"><span></span><span></span><span></span></div>
      <div id="clock">09:41</div>
    </div>
    <div>晋江同人文生成器</div>
    <div class="tb-right">
      <div class="tb-signal"><i></i><i></i><i></i><i></i></div>
      <div class="tb-battery"></div>
    </div>
  </div>

  <!-- 页面内容 -->
  <div class="content">
    
    <!-- 1. 搜索页 -->
    <div class="page active" id="page-search">
      <h1>搜索</h1>
      
      <div id="tagGroupsContainer">
        <!-- 标签组由 JS 动态生成 -->
      </div>
      
      <div style="margin-top: 20px;">
        <button class="btn-primary" onclick="toggleGenPanel()">生成同人文</button>
      </div>
      
      <!-- 生成面板 -->
      <div id="genPanel" style="display: none; margin-top: 20px;">
        <div class="card">
          <div class="card-title">生成设置</div>
          
          <label>每一篇章字数</label>
          <select>
            <option>500</option><option>1000</option>
            <option selected>2000</option><option>3000</option>
            <option>5000</option><option>10000</option>
          </select>
          
          <label>文风设定</label>
          <select>
            <option selected>晋江文学</option><option>起点文学</option>
            <option>番茄文学</option><option>LOFTER文学</option>
          </select>
          
          <label>AI扩写指令（选填）</label>
          <textarea placeholder="例如：两人在雨夜重逢，气氛暧昧..."></textarea>
          
          <label>严禁AI生成的内容（必填）</label>
          <textarea placeholder="例如：禁止出现政治敏感内容、暴力描写..." style="border-color: #E74C3C;"></textarea>
          
          <button class="btn-primary" onclick="addToShelf()">开始生成</button>
        </div>
      </div>
    </div>

    <!-- 2. 书架页 -->
    <div class="page" id="page-shelf">
      <h1>书架</h1>
      
      <!-- 空状态 -->
      <div id="shelfEmpty" style="text-align: center; padding: 50px 0; color: var(--accentLight);">
        <svg width="60" height="60" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1" style="margin-bottom: 16px; opacity: 0.5;"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path></svg>
        <p>暂无收藏文章</p>
        <button class="btn-sec" style="margin-top: 16px;" onclick="switchTab('search')">去搜索</button>
      </div>

      <!-- 文章列表 -->
      <div id="shelfList" style="display: none;">
        <!-- 由 JS 渲染 -->
      </div>
    </div>

    <!-- 3. 设置页 -->
    <div class="page" id="page-settings">
      <h1>设置</h1>
      
      <!-- API 预设管理 -->
      <div class="card">
        <div class="card-title">API 预设管理</div>
        
        <label>当前预设</label>
        <select id="apiPresetSelect" onchange="loadPreset(this.value)">
          <option value="default">默认预设</option>
        </select>
        
        <div class="btn-row" style="flex-wrap: wrap;">
          <button class="btn-sec" style="flex: 1 1 40%;" onclick="newPreset()">新建预设</button>
          <button class="btn-sec" style="flex: 1 1 40%;" onclick="savePreset()">保存修改</button>
          <button class="btn-sec" style="flex: 1 1 100%; color:#E74C3C;" onclick="deletePreset()">删除当前预设</button>
        </div>
      </div>

      <!-- API 配置 -->
      <div class="card">
        <div class="card-title">API 配置</div>
        <label>API URL</label>
        <input type="text" id="apiUrl" placeholder="https://api.example.com/v1" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">
        
        <label>API 密钥</label>
        <!-- 伪装密码防安全键盘 -->
        <input type="text" id="apiKey" class="hide-text" placeholder="sk-..." autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">
        
        <button class="btn-sec" style="width: 100%;" onclick="testApi()">测试连接</button>
      </div>

      <!-- 文风预设 -->
      <div class="card">
        <div class="card-title">文风预设</div>
        <select id="styleSelect">
          <option>晋江文学</option><option>起点文学</option>
          <option>番茄文学</option><option>LOFTER文学</option>
        </select>
        <button class="btn-sec" style="width: 100%;" onclick="addCustomStyle()">新建自定义文风</button>
      </div>

      <!-- 外观 -->
      <div class="card">
        <div class="card-title">外观</div>
        
        <label>字体</label>
        <select onchange="changeFont(this.value)">
          <option value="kaiti" selected>课本楷体</option>
          <option value="songti">课本宋体</option>
          <option value="system">系统原生</option>
          <option value="custom">自定义上传</option>
        </select>

        <label>字号大小 (12 - 24)</label>
        <div style="display: flex; gap: 10px; align-items: center; margin-bottom: 12px;">
          <input type="range" min="12" max="24" value="16" style="margin-bottom:0;" oninput="document.documentElement.style.setProperty('--app-font-size', this.value + 'px')">
        </div>

        <label>自定义壁纸</label>
        <button class="btn-sec" style="width: 100%; margin-bottom: 12px;" onclick="toast('请选择图片文件')">上传壁纸</button>

        <label>主题模式</label>
        <div class="btn-row" style="margin-top: 6px;">
          <button class="btn-sec" onclick="setTheme('day')">日间</button>
          <button class="btn-sec" onclick="setTheme('night')">夜间</button>
          <button class="btn-sec" onclick="setTheme('korean')">韩系</button>
        </div>
      </div>

      <!-- 世界观设定 -->
      <div class="card">
        <div class="card-title">世界观设定</div>
        <button class="btn-sec" style="width: 100%; margin-bottom: 8px;" onclick="toast('打开 ABO 世界观管理')">ABO世界观</button>
        <button class="btn-sec" style="width: 100%;" onclick="toast('编辑世界书词条')">世界书词条</button>
      </div>
    </div>
    
  </div>

  <!-- 底部导航 -->
  <div class="bottom-nav">
    <div class="nav-item active" id="nav-search" onclick="switchTab('search')">
      <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="8" fill="none" stroke="currentColor" stroke-width="2"></circle><line x1="21" y1="21" x2="16.65" y2="16.65" stroke="currentColor" stroke-width="2"></line></svg>
      搜索
    </div>
    <div class="nav-item" id="nav-shelf" onclick="switchTab('shelf')">
      <svg viewBox="0 0 24 24"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z" fill="none" stroke="currentColor" stroke-width="2"></path></svg>
      书架
    </div>
    <div class="nav-item" id="nav-settings" onclick="switchTab('settings')">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3" fill="none" stroke="currentColor" stroke-width="2"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z" fill="none" stroke="currentColor" stroke-width="2"></path></svg>
      设置
    </div>
  </div>

</div>

<!-- ================= 弹窗组件 ================= -->
<!-- 手机文学 -->
<div class="modal-overlay" id="modal-phoneLiterature">
  <div class="modal-content">
    <div class="modal-title">手机文学</div>
    <div class="modal-desc">选两个角色，输入指令，生成聊天记录</div>
    <label>角色 1</label><input type="text" placeholder="角色1名称">
    <label>角色 2</label><input type="text" placeholder="角色2名称">
    <label>指令</label><textarea placeholder="输入指令..."></textarea>
    <div class="chat-box" style="display: none;" id="mockChat">
      <div class="msg left">你今天怎么没来？</div>
      <div class="msg right">在宿舍休息。</div>
      <div class="msg left">要不要给你带点吃的？</div>
    </div>
    <div class="btn-row" style="margin-top: 10px;">
      <button class="btn-outline" onclick="closeModal('modal-phoneLiterature')">取消</button>
      <button class="btn-primary" style="margin-top:0;" onclick="document.getElementById('mockChat').style.display='flex'; toast('生成成功')">生成</button>
    </div>
  </div>
</div>

<!-- 小短剧 -->
<div class="modal-overlay" id="modal-miniDrama">
  <div class="modal-content">
    <div class="modal-title">小短剧</div>
    <div class="modal-desc">输入指令，选字数和文风，生成短篇剧情</div>
    <label>指令</label><textarea placeholder="输入指令..."></textarea>
    <label>字数</label>
    <select><option>500</option><option>1000</option><option>2000</option></select>
    <div class="btn-row" style="margin-top: 10px;">
      <button class="btn-outline" onclick="closeModal('modal-miniDrama')">取消</button>
      <button class="btn-primary" style="margin-top:0;" onclick="closeModal('modal-miniDrama'); toast('生成成功')">生成</button>
    </div>
  </div>
</div>

<!-- 文章详情 -->
<div class="modal-overlay" id="modal-articleDetail">
  <div class="modal-content">
    <div class="modal-title">文章详情</div>
    <div style="max-height: 200px; overflow-y: auto; margin-bottom: 16px; font-size: 14px; line-height: 1.6; padding: 10px; background: var(--card); border-radius: 8px;">
      林晚站在天台上，风吹起她的发丝。她转过头，眼中闪烁着星星的光芒...<br><br>
      “你知道吗？”她的声音有些颤抖，“我一直都在看着你。”
    </div>
    <label>续写历史（最多10次）</label>
    <div class="tags" style="margin-bottom: 12px;">
      <div class="tag">两人关系升温</div>
      <div class="tag">揭开过去的秘密</div>
    </div>
    <label>续写方向</label>
    <input type="text" placeholder="例如：两人关系升温...">
    <button class="btn-primary" style="margin-top: 10px;" onclick="toast('已续写')">续写</button>
    <button class="btn-outline" onclick="closeModal('modal-articleDetail')">关闭</button>
  </div>
</div>

<script>
  // ================= 核心逻辑 =================
  
  // 时钟
  function updateClock() {
    const d = new Date();
    document.getElementById('clock').textContent = String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0');
  }
  setInterval(updateClock, 10000);
  updateClock();

  // 提示框
  let toastTimer;
  function toast(msg) {
    let t = document.getElementById('toast');
    if (!t) { t = document.createElement('div'); t.id = 'toast'; t.className = 'toast'; document.body.appendChild(t); }
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => t.classList.remove('show'), 2000);
  }

  // 抽屉逻辑
  function toggleDrawer() {
    document.getElementById('drawer').classList.toggle('active');
    document.getElementById('drawerOverlay').classList.toggle('active');
  }

  // 弹窗逻辑
  function openModal(id) { document.getElementById(id).classList.add('active'); }
  function closeModal(id) { document.getElementById(id).classList.remove('active'); }

  // 页面切换
  function switchTab(name) {
    document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
    const page = document.getElementById('page-' + name);
    if (page) page.classList.add('active');
    
    document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
    const nav = document.getElementById('nav-' + name);
    if (nav) nav.classList.add('active');
    
    document.querySelector('.content').scrollTop = 0;
  }

  // 主题、字体
  function setTheme(mode) { document.getElementById('app').dataset.theme = mode; toast('主题已切换'); }
  function changeFont(type) {
    if (type === 'kaiti') document.documentElement.style.setProperty('--app-font-family', "'Kaiti SC', 'STKaiti', 'KaiTi', '楷体', serif");
    else if (type === 'songti') document.documentElement.style.setProperty('--app-font-family', "'Noto Serif SC', 'SimSun', '宋体', serif");
    else if (type === 'system') document.documentElement.style.setProperty('--app-font-family', "-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif");
    else toast('请选择自定义字体文件');
    toast('字体已切换');
  }

  // ================= 动态渲染标签 =================
  const tagGroups = [
    { title: "世界观", tags: ["ABO", "哨兵向导", "星际", "末日", "修仙", "西幻", "现代都市", "古代架空", "娱乐圈", "兽人"] },
    { title: "关系设定", tags: ["年上", "年下", "青梅竹马", "破镜重圆", "先婚后爱", "追妻火葬场", "强强", "双强"] },
    { title: "题材类型", tags: ["娱乐圈", "校园", "职场", "电竞", "体育竞技", "悬疑推理", "无限流", "系统"] },
    { title: "性别组合", tags: ["BG", "BL", "GL", "GB", "无CP", "百合", "耽美", "言情"] },
    { title: "热门风格", tags: ["甜宠", "虐恋", "沙雕", "正剧", "轻松", "暗黑", "治愈", "致郁"] }
  ];
  
  const tagContainer = document.getElementById('tagGroupsContainer');
  tagGroups.forEach(group => {
    const div = document.createElement('div');
    div.className = 'tag-group';
    div.innerHTML = `<div class="tag-group-title">${group.title}</div>`;
    const tagsBox = document.createElement('div');
    tagsBox.className = 'tags';
    group.tags.forEach(tag => {
      const el = document.createElement('div');
      el.className = 'tag';
      el.textContent = tag;
      el.onclick = function() { this.classList.toggle('on'); };
      tagsBox.appendChild(el);
    });
    div.appendChild(tagsBox);
    tagContainer.appendChild(div);
  });

  // ================= 生成面板操作 =================
  function toggleGenPanel() {
    const p = document.getElementById('genPanel');
    p.style.display = p.style.display === 'none' ? 'block' : 'none';
  }

  function addToShelf() {
    toast('正在生成...');
    setTimeout(() => {
      document.getElementById('shelfEmpty').style.display = 'none';
      const list = document.getElementById('shelfList');
      list.style.display = 'block';
      
      const card = document.createElement('div');
      card.className = 'card';
      card.innerHTML = `
        <div class="card-title">生成的文章</div>
        <div class="card-desc">顾砚 x 你 | 晋江文学 | 2000字</div>
        <div class="btn-row" style="margin-top: 10px;">
          <button class="btn-sec" onclick="toast('进入编辑模式')">编辑</button>
          <button class="btn-sec" onclick="this.closest('.card').remove(); if(document.getElementById('shelfList').children.length === 0){document.getElementById('shelfEmpty').style.display = 'block'; document.getElementById('shelfList').style.display = 'none';}">删除</button>
        </div>
        <button class="btn-primary" style="padding: 10px; margin-top: 10px;" onclick="openModal('modal-articleDetail')">阅读详情</button>
      `;
      list.prepend(card);
      switchTab('shelf');
      toast('生成成功');
    }, 1000);
  }

  // ================= 文风预设 =================
  function addCustomStyle() {
    const name = prompt('请输入自定义文风名称：');
    if(name && name.trim()) {
      const sel = document.getElementById('styleSelect');
      const opt = document.createElement('option');
      opt.textContent = name.trim();
      sel.appendChild(opt); sel.value = name.trim();
      toast('文风已新建并选中');
    }
  }

  // ================= API 预设管理系统 =================
  // 模拟初始预设数据
  let apiPresets = {
    '默认预设': { url: 'https://api.openai.com/v1', key: 'sk-default-key' },
    '备用预设': { url: 'https://api.deepseek.com/v1', key: 'sk-backup-key' }
  };
  
  function initApiPresets() {
    const sel = document.getElementById('apiPresetSelect');
    sel.innerHTML = '';
    Object.keys(apiPresets).forEach(name => {
      const opt = document.createElement('option');
      opt.value = name; opt.textContent = name;
      sel.appendChild(opt);
    });
    loadPreset(sel.value);
  }

  function loadPreset(name) {
    if(apiPresets[name]) {
      document.getElementById('apiUrl').value = apiPresets[name].url;
      document.getElementById('apiKey').value = apiPresets[name].key;
    }
  }

  function newPreset() {
    const name = prompt('请输入新预设名称：');
    if(name && name.trim()) {
      if(apiPresets[name.trim()]) { toast('该名称已存在'); return; }
      
      // 用当前输入框的值作为新预设的初始值
      apiPresets[name.trim()] = {
        url: document.getElementById('apiUrl').value,
        key: document.getElementById('apiKey').value
      };
      
      const sel = document.getElementById('apiPresetSelect');
      const opt = document.createElement('option');
      opt.value = name.trim(); opt.textContent = name.trim();
      sel.appendChild(opt); sel.value = name.trim();
      toast('预设已新建并保存');
    }
  }

  function savePreset() {
    const currentName = document.getElementById('apiPresetSelect').value;
    if(!currentName) return;
    apiPresets[currentName] = {
      url: document.getElementById('apiUrl').value,
      key: document.getElementById('apiKey').value
    };
    toast('当前预设已保存');
  }

  function deletePreset() {
    const currentName = document.getElementById('apiPresetSelect').value;
    if(!currentName) return;
    if(Object.keys(apiPresets).length <= 1) { toast('至少保留一个预设'); return; }
    
    if(confirm(`确定要删除预设 "${currentName}" 吗？`)) {
      delete apiPresets[currentName];
      initApiPresets(); // 重新初始化并加载第一个
      toast('预设已删除');
    }
  }

  function testApi() {
    toast('正在测试连接...');
    setTimeout(() => toast('连接成功'), 800);
  }

  // 页面启动初始化
  initApiPresets();
</script>
</body>
</html>
